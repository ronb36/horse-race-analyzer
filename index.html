  }

<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

// ============================================================
// HORSE RACE ANALYZER — a tribute to the 1979 Mattel original
// Two-stage card reader: scan races -> pick -> extract -> rate
// ============================================================

function num(v) {
  const n = typeof v === "string" ? parseFloat(v) : v;
  return Number.isFinite(n) ? n : null;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// Parse "8-1", "5/2", "2.5" -> decimal odds-to-1
function parseOdds(v) {
  if (v === null || v === undefined || v === "") return null;
  const str = String(v).trim();
  const m = str.match(/^(\d+(?:\.\d+)?)\s*[-\/]\s*(\d+(?:\.\d+)?)$/);
  if (m) return parseFloat(m[1]) / parseFloat(m[2]);
  const f = parseFloat(str);
  return Number.isFinite(f) ? f : null;
}

// ---------- Brisnet single-file data parser (deterministic — no AI involved) ----------
function parseCSVLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function looksLikeBrisnet(text) {
  const first = (text || "").split(/\r?\n/, 1)[0] || "";
  return first.split(",").length > 300;
}

function parseBrisnetFile(text) {
  const rows = text.split(/\r?\n/).filter((l) => l.trim().length).map(parseCSVLine);
  const f = (row, n) => (row[n - 1] ?? "").trim();
  const fn = (row, n) => { const x = parseFloat(f(row, n)); return Number.isFinite(x) ? x : null; };
  const byRace = new Map();
  for (const row of rows) {
    if (row.length < 850) continue;
    if (f(row, 5) === "S") continue; // scratched
    const raceNo = fn(row, 3);
    if (raceNo === null) continue;
    if (!byRace.has(raceNo)) byRace.set(raceNo, []);
    byRace.get(raceNo).push(row);
  }
  const first = rows.find((r) => r.length >= 850);
  const dateRaw = first ? f(first, 2) : "";
  const title = first
    ? `${f(first, 1)} ${dateRaw.length === 8 ? dateRaw.slice(4, 6) + "/" + dateRaw.slice(6, 8) + "/" + dateRaw.slice(0, 4) : dateRaw}`
    : "Brisnet card";
  const races = [...byRace.keys()].sort((a, b) => a - b).map((no) => {
    const rws = byRace.get(no);
    const r0 = rws[0];
    const yards = fn(r0, 6);
    const type = f(r0, 9).toUpperCase();
    const ageSex = f(r0, 10).toUpperCase();
    return {
      raceNumber: no,
      distanceFurlongs: yards !== null ? Math.round((Math.abs(yards) / 220) * 100) / 100 : null,
      surface: /T/i.test(f(r0, 7)) ? "turf" : "dirt",
      purse: fn(r0, 12),
      type: f(r0, 11) || type,
      isMaiden: type === "S" || type === "M" || type === "MO",
      is2yo: ageSex.slice(0, 2) === "AO",
      horseCount: rws.length,
    };
  });
  return { title, track: first ? f(first, 1) : "", dateStr: dateRaw, races, byRace };
}

function titleCase(str) {
  return String(str || "").toLowerCase()
    .replace(/(^|[\s'’-])\S/g, (c) => c.toUpperCase())
    .replace(/(['’])S(\s|$)/g, "$1s$2");
}

function brisnetHorses(rws) {
  const f = (row, n) => (row[n - 1] ?? "").trim();
  const fn = (row, n) => { const x = parseFloat(f(row, n)); return Number.isFinite(x) ? x : null; };
  const t = (v) => (v === null || v === undefined ? "" : String(v));
  return rws.map((row) => {
    const past = (slot) => {
      if (!f(row, 256 + slot)) return { finishPosition: "", lengthsBehindFirstCall: "", lengthsBehindSecondCall: "", lengthsBehindFinish: "", speedRating: "" };
      return {
        finishPosition: t(fn(row, 616 + slot)),
        lengthsBehindFirstCall: t(fn(row, 666 + slot)),
        lengthsBehindSecondCall: t(fn(row, 686 + slot)),
        lengthsBehindFinish: t(fn(row, 746 + slot)),
        speedRating: t(fn(row, 846 + slot)),
      };
    };
    let races = fn(row, 86), w = fn(row, 87), p = fn(row, 88), sh = fn(row, 89), earn = fn(row, 90);
    if (!races) { races = fn(row, 97); w = fn(row, 98); p = fn(row, 99); sh = fn(row, 100); earn = fn(row, 101); }
    const ml = fn(row, 44);
    return {
      name: titleCase(f(row, 45)) || "",
      postPosition: t(fn(row, 4)),
      daysSinceLastRace: t(fn(row, 224)),
      racesThisYear: t(races), wins: t(w), places: t(p), shows: t(sh), earnings: t(earn),
      mlOdds: ml !== null ? t(Math.round(ml * 100) / 100) : "",
      lastRace: past(0), priorRace: past(1),
    };
  });
}

function ratePastRaceEarlySpeed(race) {
  if (!race) return null;
  const leb1 = num(race.lengthsBehindFirstCall);
  if (leb1 === null) return null;
  return clamp(12 - leb1 * 1.5, 0, 12);
}

function rateHorse(horse, raceInfo, speedScale) {
  const c = {};
  const isSprint = (num(raceInfo.distanceFurlongs) ?? 8) < 8;

  // 1. EARLY SPEED — Quirin's strongest positive factor
  const es1 = ratePastRaceEarlySpeed(horse.lastRace);
  const es2 = ratePastRaceEarlySpeed(horse.priorRace);
  let early = 0, earlyCount = 0;
  if (es1 !== null) { early += es1; earlyCount++; }
  if (es2 !== null) { early += es2; earlyCount++; }
  if (earlyCount === 1) early *= 2;
  c.earlySpeed = clamp(early * (isSprint ? 1.25 : 1), 0, isSprint ? 30 : 24);

  // 2. RECENT FORM
  let form = 0;
  const lr = horse.lastRace || {};
  const fin = num(lr.finishPosition);
  if (fin !== null) {
    const finPts = { 1: 10, 2: 8, 3: 6, 4: 4, 5: 2 }[fin] ?? 0;
    form += isSprint ? finPts * 0.6 : finPts;
  }
  const lebFin = num(lr.lengthsBehindFinish);
  if (lebFin !== null) form += clamp(8 - lebFin, 0, 8);
  const leb2 = num(lr.lengthsBehindSecondCall);
  if (lebFin !== null && leb2 !== null && lebFin < leb2) form += 2;
  c.recentForm = clamp(form, 0, 20);

  // 3. SPEED RATINGS
  const sr1 = num(lr.speedRating);
  const sr2 = num((horse.priorRace || {}).speedRating);
  const figs = [sr1, sr2].filter((x) => x !== null);
  if (figs.length) {
    const avg = figs.reduce((a, b) => a + b, 0) / figs.length;
    c.speed = speedScale === "beyer"
      ? clamp(((avg - 40) / 60) * 24, 0, 24)
      : clamp(((avg - 60) / 40) * 24, 0, 24);
  } else c.speed = 0;

  // 4. CLASS
  const races = num(horse.racesThisYear);
  const earnings = num(horse.earnings);
  const purse = num(raceInfo.purse);
  if (races && earnings !== null && purse) {
    c.class = clamp((earnings / races / (0.6 * purse)) * 12, 0, 12);
  } else c.class = 0;

  // 5. CONSISTENCY
  const w = num(horse.wins), p = num(horse.places), s = num(horse.shows);
  if (races && w !== null) {
    c.consistency = clamp((w / races) * 8 + ((w + (p ?? 0) + (s ?? 0)) / races) * 4, 0, 12);
  } else c.consistency = 0;

  // 6. FRESHNESS
  const days = num(horse.daysSinceLastRace);
  if (days !== null) {
    if (days >= 7 && days <= 30) c.freshness = 8;
    else if (days >= 31 && days <= 45) c.freshness = 6;
    else if (days >= 4 && days <= 6) c.freshness = 5;
    else if (days >= 46 && days <= 60) c.freshness = 4;
    else if (days >= 61 && days <= 90) c.freshness = 2;
    else if (days < 4) c.freshness = 3;
    else c.freshness = 0;
  } else c.freshness = 0;

  // 7. POST POSITION
  const post = num(horse.postPosition);
  if (post !== null) {
    if (isSprint) c.post = post <= 4 ? 2 : post <= 8 ? 1 : 0;
    else c.post = post <= 7 ? 1 : post >= 10 ? -1 : 0;
  } else c.post = 0;

  const total = Object.values(c).reduce((a, b) => a + b, 0);
  return { components: c, rating: Math.round(total * 10) / 10 };
}

const COMPONENT_LABELS = {
  earlySpeed: "Early speed", recentForm: "Recent form", speed: "Speed figures",
  class: "Class", consistency: "Consistency", freshness: "Freshness", post: "Post position",
};

const emptyRace = () => ({
  finishPosition: "", lengthsBehindFirstCall: "", lengthsBehindSecondCall: "",
  lengthsBehindFinish: "", speedRating: "",
});
const emptyHorse = () => ({
  name: "", postPosition: "", daysSinceLastRace: "", racesThisYear: "",
  wins: "", places: "", shows: "", earnings: "", mlOdds: "",
  lastRace: emptyRace(), priorRace: emptyRace(),
});

// ---------- Qualification rules (from the 1979 manual) ----------
function qualify(r) {
  const reasons = [];
  if (r.isMaiden) reasons.push("maiden race");
  if (r.is2yo) reasons.push("2-year-olds");
  if (num(r.distanceFurlongs) !== null && r.distanceFurlongs < 6) reasons.push("under 6 furlongs");
  return { ok: reasons.length === 0, reason: reasons.join(", ") };
}

// ---------- Styles ----------
const APP_VERSION = "1.2.0";
const GOLD = "linear-gradient(175deg, #E3C98C 0%, #C9A96A 35%, #B8944F 60%, #D8BC7E 100%)";
const GREEN = "#16382B";
const GREEN_DARK = "#0E2820";
const LCD_BG = "#96A08D";
const LCD_INK = "#2A3328";
const RED = "#B5442C";
const lcdFont = { fontFamily: "'Courier New', monospace", fontWeight: 700, color: LCD_INK, letterSpacing: "0.06em" };
const labelFont = { fontFamily: "Arial, Helvetica, sans-serif", fontSize: 9, letterSpacing: "0.08em", textTransform: "uppercase" };

function Key({ children, onClick, disabled, wide, red }) {
  return (
    <button onClick={onClick} disabled={disabled}
      style={{
        background: disabled ? "#3E5A4D" : red ? RED : GREEN, color: "#EFE8D5",
        border: "1px solid rgba(0,0,0,0.45)", borderRadius: 999,
        padding: wide ? "12px 22px" : "9px 16px",
        fontFamily: "Arial, sans-serif", fontSize: 12, fontWeight: 700,
        letterSpacing: "0.1em", textTransform: "uppercase",
        boxShadow: disabled ? "none" : "inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 3px rgba(0,0,0,0.35)",
        cursor: disabled ? "default" : "pointer", opacity: disabled ? 0.6 : 1,
      }}>{children}</button>
  );
}

function Field({ label, value, onChange }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 3 }}>
      <span style={{ ...labelFont, color: "#D8CBA8" }}>{label}</span>
      <input value={value ?? ""} onChange={(e) => onChange(e.target.value)} inputMode="decimal"
        style={{ background: LCD_BG, ...lcdFont, fontSize: 15, border: "1px solid rgba(0,0,0,0.4)",
          borderRadius: 6, padding: "7px 9px", width: "100%", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
    </label>
  );
}

function HorseRaceAnalyzer() {
  const [step, setStep] = useState("start"); // start | races | review | results
  const [apiKey, setApiKeyState] = useState(() => { try { return localStorage.getItem("hra_api_key") || ""; } catch { return ""; } });
  const setApiKey = (v) => { setApiKeyState(v); try { localStorage.setItem("hra_api_key", v); } catch {} };
  const [busy, setBusy] = useState(false);
  const [lcdMsg, setLcdMsg] = useState("READY");
  const [error, setError] = useState("");
  const [cardTitle, setCardTitle] = useState("");
  const [raceIndex, setRaceIndex] = useState([]);
  const [raceInfo, setRaceInfo] = useState({ distanceFurlongs: "", purse: "", surface: "dirt", raceNumber: "" });
  const [horses, setHorses] = useState([]);
  const [speedScale, setSpeedScale] = useState("beyer");
  const [expanded, setExpanded] = useState(null);
  const [sortMode, setSortMode] = useState("rating"); // rating | edge
  const [raceData, setRaceData] = useState({});        // raceNumber -> { raceInfo, horses }
  const [activeRace, setActiveRace] = useState(null);
  const [cardMeta, setCardMeta] = useState({ track: "", date: "" });
  const [winnerMode, setWinnerMode] = useState(false);
  const [scratchMode, setScratchMode] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [savedCards, setSavedCards] = useState(null);
  const [logMsg, setLogMsg] = useState("");
  const [supaUrl, setSupaUrlState] = useState(() => { try { return localStorage.getItem("hra_supa_url") || ""; } catch { return ""; } });
  const setSupaUrl = (v) => { setSupaUrlState(v); try { localStorage.setItem("hra_supa_url", v); } catch {} };
  const [supaKey, setSupaKeyState] = useState(() => { try { return localStorage.getItem("hra_supa_key") || ""; } catch { return ""; } });
  const setSupaKey = (v) => { setSupaKeyState(v); try { localStorage.setItem("hra_supa_key", v); } catch {} };
  const fileRef = useRef(null);
  const fileBlocksRef = useRef(null);
  const brisRef = useRef(null);

  async function filesToBlocks(fileList) {
    const files = Array.from(fileList || []);
    const supported = ["image/jpeg", "image/png", "image/webp", "image/gif", "application/pdf"];
    const bad = files.filter((f) => !supported.includes(f.type));
    if (bad.length) throw new Error(
      "Unsupported file type: " + bad.map((f) => f.name).join(", ") +
      ". Use JPG, PNG, WebP, or PDF. iPhone tip: HEIC photos won't work — screenshot the photo instead."
    );
    const blocks = [];
    for (const f of files) {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = () => rej(new Error("Could not read " + f.name));
        r.readAsDataURL(f);
      });
      blocks.push(f.type === "application/pdf"
        ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: b64 } }
        : { type: "image", source: { type: "base64", media_type: f.type, data: b64 } });
    }
    return blocks;
  }

  async function askClaude(promptText) {
    if (!apiKey) throw new Error("Enter your Anthropic API key first (tap the SET button, top right) — only needed for PDF/photo reading. Brisnet data files need no key.");
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 8000,
        temperature: 0,
        messages: [{ role: "user", content: [...fileBlocksRef.current, { type: "text", text: promptText }] }],
      }),
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = (await resp.text()).slice(0, 200); } catch {}
      throw new Error(`API request failed (HTTP ${resp.status}). ${detail}`);
    }
    const data = await resp.json();
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
    let clean = text.replace(/```json|```/g, "").trim();
    const braceAt = clean.indexOf("{");
    if (braceAt > 0) clean = clean.slice(braceAt);
    try {
      return JSON.parse(clean);
    } catch {}
    // Salvage a response that was cut off mid-stream: keep every complete entry
    const cut = clean.lastIndexOf("]]");
    if (cut > 0) {
      try {
        return JSON.parse(clean.slice(0, cut + 2) + "]}");
      } catch {}
    }
    throw new Error("Couldn't parse the reading. Raw response started: " + JSON.stringify(clean.slice(0, 160)));
  }

  function supaHeaders() {
    return { apikey: supaKey, Authorization: "Bearer " + supaKey, "Content-Type": "application/json" };
  }

  async function saveCard(meta, title, index, dataMap) {
    if (!supaUrl || !supaKey || !meta.track || !meta.date) return;
    try {
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_cards?on_conflict=track,race_date", {
        method: "POST",
        headers: { ...supaHeaders(), Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([{
          title, track: meta.track, race_date: meta.date,
          updated_at: new Date().toISOString(),
          card: { raceIndex: index, raceData: dataMap, cardMeta: meta, cardTitle: title },
        }]),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status + ": " + (await resp.text()).slice(0, 120));
    } catch (e) {
      console.error("card save failed", e);
      setError("Card auto-save to Supabase failed (data still works locally). " + (e.message || e));
    }
  }

  async function fetchSavedCards() {
    setError("");
    try {
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_cards?select=id,title,track,race_date,updated_at&order=updated_at.desc&limit=25", {
        headers: supaHeaders(),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status + ": " + (await resp.text()).slice(0, 120));
      setSavedCards(await resp.json());
    } catch (e) {
      setError("Couldn't fetch saved cards. Check Supabase settings (⚙ SET). " + (e.message || e));
    }
  }

  async function loadSavedCard(id) {
    setError(""); setBusy(true); setLcdMsg("LOADING CARD...");
    try {
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_cards?id=eq." + id + "&select=card", {
        headers: supaHeaders(),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const rows = await resp.json();
      const card = rows[0] && rows[0].card;
      if (!card) throw new Error("Card not found.");
      brisRef.current = null; fileBlocksRef.current = null;
      setCardTitle(card.cardTitle || "");
      setCardMeta(card.cardMeta || { track: "", date: "" });
      setRaceIndex(card.raceIndex || []);
      setRaceData(card.raceData || {});
      setSavedCards(null);
      const firstOk = (card.raceIndex || []).find((r) => r.ok && card.raceData && card.raceData[r.raceNumber]);
      if (firstOk) {
        const cached = card.raceData[firstOk.raceNumber];
        setRaceInfo(cached.raceInfo); setHorses(cached.horses); setActiveRace(firstOk.raceNumber);
        setExpanded(null); setSortMode("rating"); setWinnerMode(false); setLogMsg("");
        setStep("results"); setLcdMsg("RACE " + firstOk.raceNumber);
      } else { setStep("races"); setLcdMsg("SELECT RACE"); }
    } catch (e) {
      setError("Couldn't load that card. " + (e.message || e));
      setLcdMsg("READY");
    } finally { setBusy(false); }
  }

  function openBrisRace(r) {
    const info = {
      raceNumber: String(r.raceNumber),
      distanceFurlongs: r.distanceFurlongs !== null && r.distanceFurlongs !== undefined ? String(r.distanceFurlongs) : "",
      purse: r.purse !== null && r.purse !== undefined ? String(r.purse) : "",
      surface: r.surface,
    };
    const hs = brisnetHorses(brisRef.current.get(r.raceNumber));
    setRaceInfo(info);
    setHorses(hs);
    setActiveRace(r.raceNumber);
    setRaceData((prev) => ({ ...prev, [r.raceNumber]: { raceInfo: info, horses: hs } }));
    setExpanded(null); setSortMode("rating"); setWinnerMode(false); setLogMsg("");
    setStep("results");
    setLcdMsg("RACE " + r.raceNumber);
  }

  function loadBrisnet(text, label) {
    const parsedB = parseBrisnetFile(text);
    if (!parsedB.races.length) throw new Error("Parsed " + label + " but found no races in it.");
    brisRef.current = parsedB.byRace;
    fileBlocksRef.current = null;
    const title = parsedB.title + " · Brisnet data";
    const meta = { track: parsedB.track, date: parsedB.dateStr };
    setCardTitle(title);
    setCardMeta(meta);
    const list = parsedB.races.map((race) => ({ ...race, ...qualify(race) }));
    setRaceIndex(list);
    const dataMap = {};
    for (const r of list) {
      if (!r.ok) continue;
      dataMap[r.raceNumber] = {
        raceInfo: {
          raceNumber: String(r.raceNumber),
          distanceFurlongs: r.distanceFurlongs !== null && r.distanceFurlongs !== undefined ? String(r.distanceFurlongs) : "",
          purse: r.purse !== null && r.purse !== undefined ? String(r.purse) : "",
          surface: r.surface,
        },
        horses: brisnetHorses(parsedB.byRace.get(r.raceNumber)),
      };
    }
    setRaceData(dataMap);
    setActiveRace(null);
    saveCard(meta, title, list, dataMap);
    const firstOk = list.find((r) => r.ok && dataMap[r.raceNumber]);
    if (firstOk) {
      const cached = dataMap[firstOk.raceNumber];
      setRaceInfo(cached.raceInfo); setHorses(cached.horses); setActiveRace(firstOk.raceNumber);
      setExpanded(null); setSortMode("rating"); setWinnerMode(false); setLogMsg("");
      setStep("results"); setLcdMsg("RACE " + firstOk.raceNumber);
    } else { setStep("races"); setLcdMsg("SELECT RACE"); }
  }

  function switchTab(r) {
    if (!r.ok || busy) return;
    // persist current race's edits before leaving it
    if (activeRace !== null) {
      const curInfo = raceInfo, curHorses = horses;
      const merged = { ...raceData, [activeRace]: { raceInfo: curInfo, horses: curHorses } };
      setRaceData(merged);
      saveCard(cardMeta, cardTitle, raceIndex, merged);
    }
    setError(""); setExpanded(null); setSortMode("rating"); setWinnerMode(false); setLogMsg("");
    const cached = raceData[r.raceNumber];
    if (cached) {
      setRaceInfo(cached.raceInfo);
      setHorses(cached.horses);
      setActiveRace(r.raceNumber);
      setStep("results");
      setLcdMsg("RACE " + r.raceNumber);
      return;
    }
    if (brisRef.current && brisRef.current.has(r.raceNumber)) { openBrisRace(r); return; }
    pickRace(r); // PDF path: extract via vision, lands on review
  }

  // ----- STAGE 1: scan the card, list every race -----
  async function handleFiles(fileList) {
    setError("");
    setBusy(true);
    setLcdMsg("SCANNING CARD...");
    try {
      const filesArr = Array.from(fileList || []);
      // Brisnet ZIP straight from the download — unzip in the browser
      if (filesArr.length === 1 && (/\.zip$/i.test(filesArr[0].name) || /zip/.test(filesArr[0].type || ""))) {
        if (typeof fflate === "undefined") throw new Error("ZIP support didn't load. Unzip the file and upload the data file inside it instead.");
        const buf = new Uint8Array(await filesArr[0].arrayBuffer());
        const entries = fflate.unzipSync(buf);
        const names = Object.keys(entries).filter((n) => !n.endsWith("/"));
        let text = null, used = null;
        for (const n of names) {
          if (/\.(drf|dr[0-9]|mcp|csv|txt)$/i.test(n)) { text = new TextDecoder("latin1").decode(entries[n]); used = n; break; }
        }
        if (text === null) {
          for (const n of names) {
            const t2 = new TextDecoder("latin1").decode(entries[n]);
            if (looksLikeBrisnet(t2)) { text = t2; used = n; break; }
          }
        }
        if (text === null || !looksLikeBrisnet(text)) {
          throw new Error("No Brisnet data file found inside " + filesArr[0].name + ". It contains: " + names.join(", "));
        }
        loadBrisnet(text, used);
        return;
      }
      // Bare Brisnet data file (any name — validated by column count, not extension)
      if (filesArr.length === 1 && !/^(image\/|application\/pdf)/.test(filesArr[0].type || "")) {
        const rawText = await filesArr[0].text();
        if (looksLikeBrisnet(rawText)) {
          loadBrisnet(rawText, filesArr[0].name);
          return;
        }
        if (/\.(drf|dr[0-9]|mcp|csv|txt)$/i.test(filesArr[0].name)) {
          throw new Error("That file doesn't look like a Brisnet single-file card (too few columns). Buy the \"Single Data File\" product on brisnet.com and upload its ZIP or the data file inside.");
        }
      }
      brisRef.current = null;
      fileBlocksRef.current = await filesToBlocks(fileList);
      const parsed = await askClaude(
        `List every race on this past-performance card. Respond with ONLY valid compact JSON, no markdown fences, no commentary:
{"title":"Track MM/DD/YYYY","races":[[raceNumber,distanceFurlongs,"dirt"|"turf",purse,"short race type",isMaiden(0 or 1),is2yoOnly(0 or 1),horseCount],...]}
Notes: distanceFurlongs as a number (1 mile = 8, 1 1/16 mi = 8.5, 5 1/2f = 5.5). isMaiden=1 for any maiden race. is2yoOnly=1 if restricted to two-year-olds. Be terse; JSON only.`
      );
      setCardTitle(parsed.title || "");
      const m = /^(.*?)\s+(\d{2})\/(\d{2})\/(\d{4})/.exec(parsed.title || "");
      setCardMeta({ track: m ? m[1] : (parsed.title || ""), date: m ? m[4] + m[2] + m[3] : "" });
      setRaceData({}); setActiveRace(null);
      const pdfList = (parsed.races || []).map((r) => {
        const race = {
          raceNumber: r[0], distanceFurlongs: r[1], surface: r[2] || "dirt",
          purse: r[3], type: r[4] || "", isMaiden: !!r[5], is2yo: !!r[6], horseCount: r[7],
        };
        return { ...race, ...qualify(race) };
      });
      setRaceIndex(pdfList);
      const pdfFirst = pdfList.find((rr) => rr.ok);
      if (pdfFirst) { await pickRace(pdfFirst); }
      else { setStep("races"); setLcdMsg("SELECT RACE"); }
    } catch (e) {
      console.error(e);
      setError(e.message || String(e));
      setLcdMsg("READY");
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }

  // ----- STAGE 2: extract one chosen race -----
  async function pickRace(r) {
    if (!r.ok || busy) return;
    setError("");
    if (brisRef.current && brisRef.current.has(r.raceNumber)) { openBrisRace(r); return; }
    setBusy(true);
    setLcdMsg(`READING RACE ${r.raceNumber}...`);
    try {
      const parsed = await askClaude(
        `Extract ONLY race number ${r.raceNumber} from this card. Respond with ONLY valid compact JSON, no markdown fences, no spaces, no commentary:
{"horses":[["name",postPosition,daysSinceLastRace,racesThisYear,wins,places,shows,earnings,"morningLineOdds",[lastFinishPos,lenBehind1stCall,lenBehind2ndCall,lenBehindFinish,speedRating],[priorFinishPos,lenBehind1stCall,lenBehind2ndCall,lenBehindFinish,speedRating]],...]}
Rules: lenBehind = lengths behind the leader at that call (0 if leading), read from the running-line superscripts. speedRating = Beyer figure. races/wins/places/shows/earnings from the current-year record line (lifetime if that is all shown). daysSinceLastRace = most recent race date to today. morningLineOdds exactly as printed, e.g. "5-2" or "8-1", in position 9 of each horse array. The two trailing arrays are the two most recent races; use [null,null,null,null,null] if a horse has fewer than 2 starts. Every horse array has exactly 11 elements. JSON only, no trailing text.`
      );
      const toStr = (v) => (v === null || v === undefined ? "" : String(v));
      const mapRace = (arr) => ({
        finishPosition: toStr(arr?.[0]), lengthsBehindFirstCall: toStr(arr?.[1]),
        lengthsBehindSecondCall: toStr(arr?.[2]), lengthsBehindFinish: toStr(arr?.[3]),
        speedRating: toStr(arr?.[4]),
      });
      const infoObj = {
        raceNumber: toStr(r.raceNumber), distanceFurlongs: toStr(r.distanceFurlongs),
        purse: toStr(r.purse), surface: r.surface,
      };
      const horsesArr = ((parsed.horses || []).map((h) => ({
        name: toStr(h?.[0]), postPosition: toStr(h?.[1]), daysSinceLastRace: toStr(h?.[2]),
        racesThisYear: toStr(h?.[3]), wins: toStr(h?.[4]), places: toStr(h?.[5]),
        shows: toStr(h?.[6]), earnings: toStr(h?.[7]),
        mlOdds: toStr(h?.[8]),
        lastRace: mapRace(h?.[9]), priorRace: mapRace(h?.[10]),
      })));
      setRaceInfo(infoObj);
      setHorses(horsesArr);
      setActiveRace(r.raceNumber);
      setRaceData((prev) => ({ ...prev, [r.raceNumber]: { raceInfo: infoObj, horses: horsesArr } }));
      setStep("review");
      setLcdMsg("CHECK ENTRIES");
    } catch (e) {
      console.error(e);
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  }

  function startManual() {
    setHorses([emptyHorse(), emptyHorse()]);
    setRaceInfo({ distanceFurlongs: "", purse: "", surface: "dirt", raceNumber: "" });
    setStep("review");
    setLcdMsg("ENTER DATA");
  }

  function toggleScratch(i) {
    setHorses((prev) => prev.map((h, j) => (j === i ? { ...h, scratched: !h.scratched } : h)));
  }

  function updateHorse(i, path, value) {
    setHorses((prev) => {
      const next = prev.map((h) => ({ ...h, lastRace: { ...h.lastRace }, priorRace: { ...h.priorRace } }));
      const parts = path.split(".");
      if (parts.length === 1) next[i][parts[0]] = value;
      else next[i][parts[0]][parts[1]] = value;
      return next;
    });
  }

  const results = horses
    .map((h, i) => ({ i, name: h.name || `Horse ${i + 1}`, post: h.postPosition, scratched: !!h.scratched, odds: parseOdds(h.mlOdds), ...rateHorse(h, raceInfo, speedScale) }))
    .sort((a, b) => (a.scratched === b.scratched ? b.rating - a.rating : a.scratched ? 1 : -1));
  const live = results.filter((r) => !r.scratched);
  const topRating = live.length ? live[0].rating : 0;
  const TAU = 8;
  const expW = live.map((r) => Math.exp((r.rating - topRating) / TAU));
  const expSum = expW.reduce((a, b) => a + b, 0) || 1;
  const pWin = new Map(live.map((r, idx) => [r.i, expW[idx] / expSum]));
  // Harville formulas: probabilities of finishing 2nd and 3rd, giving place (top-2) and show (top-3)
  const placeMap = new Map(), showMap = new Map();
  {
    const ps = live.map((r) => pWin.get(r.i));
    const n = ps.length;
    for (let x = 0; x < n; x++) {
      let p2 = 0, p3 = 0;
      for (let y = 0; y < n; y++) {
        if (y === x) continue;
        const py = ps[y];
        p2 += py * (ps[x] / (1 - py));
        for (let z = 0; z < n; z++) {
          if (z === x || z === y) continue;
          const pz = ps[z];
          p3 += py * (pz / (1 - py)) * (ps[x] / (1 - py - pz));
        }
      }
      placeMap.set(live[x].i, Math.min(1, ps[x] + p2));
      showMap.set(live[x].i, Math.min(1, ps[x] + p2 + p3));
    }
  }
  const overlay = results.map((r) => {
    if (r.scratched) return { ...r, pModel: null, pPlace: null, pShow: null, pBoard: null, edge: null, fair: null };
    const pModel = pWin.get(r.i) ?? 0;
    const o = r.odds;
    const pBoard = o !== null ? 1 / (o + 1) : null;
    const edge = o !== null ? pModel * (o + 1) - 1 : null;
    const fair = pModel > 0 ? (1 - pModel) / pModel : null;
    return { ...r, pModel, pPlace: placeMap.get(r.i) ?? null, pShow: showMap.get(r.i) ?? null, pBoard, edge, fair };
  });
  const bestEdge = overlay.reduce((best, r) => (r.edge !== null && (best === null || r.edge > best.edge) ? r : best), null);
  let liveRank = 0;
  const withRank = overlay.map((r) => ({ ...r, ratingRank: r.scratched ? null : ++liveRank }));

  async function logWinner(winner) {
    try {
      const rows = overlay.filter((o) => !o.scratched).map((o) => ({
        track: cardMeta.track || null,
        race_date: cardMeta.date || null,
        race_no: num(raceInfo.raceNumber),
        distance_f: num(raceInfo.distanceFurlongs),
        surface: raceInfo.surface || null,
        purse: num(raceInfo.purse),
        horse: o.name,
        post: num(o.post),
        rating: o.rating,
        model_pct: Math.round(o.pModel * 1000) / 10,
        odds: o.odds,
        is_winner: o.i === winner.i,
      }));
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_race_log", {
        method: "POST",
        headers: { apikey: supaKey, Authorization: "Bearer " + supaKey, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(rows),
      });
      if (!resp.ok) throw new Error("Supabase said HTTP " + resp.status + ": " + (await resp.text()).slice(0, 140));
      setWinnerMode(false);
      setLogMsg(`Logged race ${raceInfo.raceNumber}: ${winner.name} won — ${rows.length} rows saved.`);
      const merged = { ...raceData, [activeRace]: { raceInfo, horses } };
      setRaceData(merged);
      saveCard(cardMeta, cardTitle, raceIndex, merged);
    } catch (e) {
      setLogMsg("");
      setError("Couldn't log the result. " + (e.message || e));
    }
  }
  const displayed = sortMode === "edge"
    ? [...withRank].sort((a, b) => (a.scratched === b.scratched ? (((b.edge ?? -999) - (a.edge ?? -999)) || (b.rating - a.rating)) : a.scratched ? 1 : -1))
    : withRank;

  return (
    <div style={{ minHeight: "100vh", background: "#EDEAE2", padding: "16px 10px 48px", fontFamily: "Arial, sans-serif" }}>
      <div style={{ maxWidth: 760, margin: "0 auto" }}>

        {/* ===== Device faceplate ===== */}
        <div style={{ display: "flex", borderRadius: 10, overflow: "hidden", boxShadow: "0 6px 18px rgba(0,0,0,0.3)" }}>
          <div style={{ width: 18, background: GREEN_DARK }} />
          <div style={{ flex: 1, background: GOLD, padding: "16px 14px", display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
            <div aria-live="polite"
              style={{ background: LCD_BG, borderRadius: 999, minWidth: 200, flex: "1 1 200px", padding: "14px 20px",
                boxShadow: "inset 0 3px 8px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.6)",
                ...lcdFont, fontSize: 18, textAlign: "center", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              {busy ? lcdMsg : step === "results"
                ? (sortMode === "edge" && bestEdge && bestEdge.edge > 0
                    ? `BEST BET: ${bestEdge.name.toUpperCase().slice(0, 12)} +${Math.round(bestEdge.edge * 100)}%`
                    : `TOP: ${results[0]?.name?.toUpperCase().slice(0, 14) || "—"} ${topRating}`)
                : lcdMsg}
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: "'Courier New', monospace", fontWeight: 700, fontSize: 15, letterSpacing: "0.14em", color: "#3A2F17" }}>
                HORSE RACE ANALYZER
              </div>
              <div style={{ ...labelFont, color: "#5A4A25", marginTop: 2 }}>Handicapping Computer · est. 1979 · v{APP_VERSION}</div>
              <button onClick={() => setShowSettings((v) => !v)} aria-label="Settings"
                style={{ marginTop: 6, background: GREEN, color: "#EFE8D5", border: "1px solid rgba(0,0,0,0.45)", borderRadius: 999, padding: "4px 12px", fontFamily: "Arial, sans-serif", fontSize: 10, fontWeight: 700, letterSpacing: "0.12em", cursor: "pointer", boxShadow: "inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 3px rgba(0,0,0,0.35)" }}>
                {showSettings ? "✕ CLOSE" : "⚙ SET"}
              </button>
            </div>
          </div>
          <div style={{ width: 18, background: GREEN_DARK }} />
        </div>

        {/* ===== Body ===== */}
        <div style={{ background: GREEN, borderRadius: 10, marginTop: 12, padding: "18px 14px 22px", boxShadow: "0 6px 18px rgba(0,0,0,0.25)", color: "#EFE8D5" }}>

          {showSettings && (
            <div style={{ background: GREEN_DARK, borderRadius: 8, padding: 14, marginBottom: 16 }}>
              <div style={{ ...labelFont, color: "#D8CBA8", marginBottom: 10 }}>Settings — stored only in this browser</div>
              <label style={{ display: "flex", flexDirection: "column", gap: 3, maxWidth: 420 }}>

                  style={{ background: LCD_BG, ...lcdFont, fontSize: 13, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 6, padding: "8px 9px", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
              </label>
              <div style={{ ...labelFont, color: "#D8CBA8", margin: "12px 0 6px" }}>Supabase results logging</div>
              <div style={{ display: "grid", gap: 8, maxWidth: 420 }}>
                <input value={supaUrl} onChange={(e) => setSupaUrl(e.target.value)} placeholder="https://xxxx.supabase.co"
                  style={{ background: LCD_BG, ...lcdFont, fontSize: 13, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 6, padding: "8px 9px", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
                <input type="password" value={supaKey} onChange={(e) => setSupaKey(e.target.value)} placeholder="Supabase anon key (not service_role)"
                  style={{ background: LCD_BG, ...lcdFont, fontSize: 13, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 6, padding: "8px 9px", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
              </div>
              <p style={{ fontSize: 10, color: "#B9C8BB", margin: "8px 0 10px", lineHeight: 1.5 }}>
                After each race goes official, hit "Log result" and tap the winner — the full prediction snapshot is saved
                to your hra_race_log table for future model tuning. The Anthropic key is only needed for PDF/photo reading.
              </p>
              <Key onClick={() => setShowSettings(false)}>Done</Key>
            </div>
          )}

          {raceIndex.length > 0 && step !== "start" && (
            <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 10, marginBottom: 8 }}>
              {raceIndex.map((r) => {
                const isActive = activeRace === r.raceNumber;
                return (
                  <button key={r.raceNumber} onClick={() => switchTab(r)} disabled={!r.ok || busy}
                    title={r.ok ? `${r.distanceFurlongs}f ${r.surface} · ${r.type}` : "Skipped: " + r.reason}
                    style={{
                      flex: "0 0 auto", minWidth: 52, padding: "7px 10px", borderRadius: 8,
                      border: isActive ? "1px solid #E3C98C" : "1px solid rgba(0,0,0,0.35)",

                    }}>
                    R{r.raceNumber}
                    <span style={{ display: "block", fontSize: 9, fontWeight: 400, letterSpacing: "0.05em", opacity: 0.85 }}>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8 }}>

              </div>
              <div style={{ marginTop: 12 }}>
                {raceIndex.map((r) => (
                  <button key={r.raceNumber} onClick={() => pickRace(r)} disabled={!r.ok || busy}
                    style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "12px 14px",
                      marginBottom: 8, borderRadius: 8, border: "1px solid rgba(0,0,0,0.35)", textAlign: "left",
                      background: r.ok ? GREEN_DARK : "#243B31", color: r.ok ? "#EFE8D5" : "#8FA396",
                      cursor: r.ok && !busy ? "pointer" : "default", opacity: busy ? 0.7 : 1 }}>
                    <span style={{ ...lcdFont, background: r.ok ? LCD_BG : "#7C857A", borderRadius: 6, padding: "4px 9px", fontSize: 15, minWidth: 34, textAlign: "center", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }}>
                      {r.raceNumber}
                    </span>
                    <span style={{ flex: 1 }}>
                      <span style={{ fontWeight: 700, fontSize: 13 }}>
                        {r.distanceFurlongs}f {r.surface} · {r.type}
                      </span>
                      <span style={{ display: "block", fontSize: 11, color: r.ok ? "#B9C8BB" : "#7E948A", marginTop: 2 }}>
                        {r.ok
                          ? `Purse $${Number(r.purse || 0).toLocaleString()}${r.horseCount ? ` · ${r.horseCount} horses` : ""} — tap to analyze`
                          : `Skipped: ${r.reason}`}
                      </span>
                    </span>
                    {r.ok && <span style={{ fontSize: 16 }}>▸</span>}
                  </button>
                ))}
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 10 }}>

              </div>

          {step === "review" && (

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8 }}>

                  <Field label="Purse ($)" value={raceInfo.purse} onChange={(v) => setRaceInfo({ ...raceInfo, purse: v })} />
                  <label style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                    <span style={{ ...labelFont, color: "#D8CBA8" }}>Speed figure scale</span>
                    <select value={speedScale} onChange={(e) => setSpeedScale(e.target.value)}
                      style={{ background: LCD_BG, ...lcdFont, fontSize: 14, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 6, padding: "8px 9px" }}>
                      <option value="beyer">Beyer (modern)</option>
                      <option value="classic">1979 DRF rating</option>
                    </select>
                  </label>
                </div>
              </div>

              {horses.map((h, i) => (
                <div key={i} style={{ background: GREEN_DARK, borderRadius: 8, padding: 12, marginTop: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <input value={h.name} placeholder={`Horse ${i + 1} name`} onChange={(e) => updateHorse(i, "name", e.target.value)}
                      style={{ background: "transparent", border: "none", borderBottom: "1px solid #4A6B5A", color: "#EFE8D5", fontSize: 15, fontWeight: 700, padding: "2px 0", width: "60%" }} />
                    <button onClick={() => setHorses(horses.filter((_, j) => j !== i))}
                      style={{ background: "none", border: "none", color: "#B9C8BB", fontSize: 11, cursor: "pointer", textDecoration: "underline" }}>
                      remove
                    </button>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(88px, 1fr))", gap: 8 }}>
                    <Field label="Post posn" value={h.postPosition} onChange={(v) => updateHorse(i, "postPosition", v)} />
                    <Field label="Days since race" value={h.daysSinceLastRace} onChange={(v) => updateHorse(i, "daysSinceLastRace", v)} />
                    <Field label="Races" value={h.racesThisYear} onChange={(v) => updateHorse(i, "racesThisYear", v)} />
                    <Field label="Wins" value={h.wins} onChange={(v) => updateHorse(i, "wins", v)} />
                    <Field label="Places" value={h.places} onChange={(v) => updateHorse(i, "places", v)} />
                    <Field label="Shows" value={h.shows} onChange={(v) => updateHorse(i, "shows", v)} />
                    <Field label="Earnings ($)" value={h.earnings} onChange={(v) => updateHorse(i, "earnings", v)} />
                    <Field label="ML odds (e.g. 5-2)" value={h.mlOdds} onChange={(v) => updateHorse(i, "mlOdds", v)} />
                  </div>
                  {["lastRace", "priorRace"].map((rk) => (
                    <div key={rk} style={{ marginTop: 10 }}>
                      <div style={{ ...labelFont, color: "#D8CBA8", marginBottom: 6 }}>{rk === "lastRace" ? "Last race" : "Race before that"}</div>
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(88px, 1fr))", gap: 8 }}>
                        <Field label="Finish posn" value={h[rk].finishPosition} onChange={(v) => updateHorse(i, `${rk}.finishPosition`, v)} />
                        <Field label="L.E.B. 1st call" value={h[rk].lengthsBehindFirstCall} onChange={(v) => updateHorse(i, `${rk}.lengthsBehindFirstCall`, v)} />
                        <Field label="L.E.B. 2nd call" value={h[rk].lengthsBehindSecondCall} onChange={(v) => updateHorse(i, `${rk}.lengthsBehindSecondCall`, v)} />
                        <Field label="L.E.B. finish" value={h[rk].lengthsBehindFinish} onChange={(v) => updateHorse(i, `${rk}.lengthsBehindFinish`, v)} />
                        <Field label="Speed rating" value={h[rk].speedRating} onChange={(v) => updateHorse(i, `${rk}.speedRating`, v)} />
                      </div>
                    </div>
                  ))}
                </div>
              ))}

              <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap" }}>
                <Key onClick={() => setHorses([...horses, emptyHorse()])}>+ Add horse</Key>
                <Key wide red onClick={() => { setStep("results"); setExpanded(null); setSortMode("rating"); }} disabled={!horses.length}>Analyze</Key>
                <Key onClick={() => { setStep(raceIndex.length ? "races" : "start"); setLcdMsg(raceIndex.length ? "SELECT RACE" : "READY"); }}>Back</Key>
              </div>
            </div>
          )}

          {/* ---------- RESULTS ---------- */}
          {step === "results" && (
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 8 }}>
                <h2 style={{ fontSize: 15, letterSpacing: "0.12em", textTransform: "uppercase", margin: 0 }}>
                  {raceInfo.raceNumber ? `Race ${raceInfo.raceNumber}` : "Ratings"} — {sortMode === "edge" ? "sorted by value" : "sorted by rating"}
                </h2>
              </div>
              <p style={{ fontSize: 11, color: "#B9C8BB", margin: "8px 0 12px", lineHeight: 1.5 }}>
                RTG = the legacy 1979-style rating; rows default to rating order, so the top row is the projected
                winner. FAIR = the odds the machine would set from that rating. ODDS = the live board — starts at the
                morning line; retype as the board changes. VALUE = how much the board overpays (+) or underpays (−) the
                machine's opinion. WIN / PLC / SHW = chance to finish 1st, top two, or top three. Value is about price,
                not performance — a big + on a longshot is a price opinion, not a prediction it wins. Tap a horse's
                name for its score breakdown.
              </p>

              <div style={{ overflowX: "auto" }}>
                <div style={{ minWidth: 500 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "58px minmax(120px, 1fr) 52px 54px 56px 44px 44px 44px", gap: 6, alignItems: "center", padding: "0 10px 4px", ...labelFont, color: "#D8CBA8" }}>
                    <span>Rtg</span><span>Horse</span><span>Fair</span><span>Odds</span><span style={{ textAlign: "right" }}>Value</span><span>Win</span><span>Plc</span><span>Shw</span>
                  </div>
                  {displayed.map((r) => {
                    const isBest = bestEdge && r.i === bestEdge.i && r.edge !== null && r.edge > 0;
                    const edgeColor = r.edge === null ? "#8FA396" : r.edge > 0.1 ? "#E3C98C" : r.edge > 0 ? "#CFDCCF" : "#8FA396";
                    const dim = r.scratched;
                    return (
                      <div key={r.i} style={{ background: GREEN_DARK, borderRadius: 8, marginBottom: 5, overflow: "hidden", opacity: dim ? 0.45 : 1, border: isBest ? "1px solid rgba(227,201,140,0.6)" : "1px solid transparent" }}>
                        <div style={{ display: "grid", gridTemplateColumns: "58px minmax(120px, 1fr) 52px 54px 56px 44px 44px 44px", gap: 6, alignItems: "center", padding: "6px 10px", background: winnerMode || scratchMode ? "rgba(227,201,140,0.06)" : "none" }}>
                          <span style={{ ...lcdFont, background: LCD_BG, borderRadius: 5, padding: "3px 6px", fontSize: 13, textAlign: "center", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)", opacity: dim ? 0.6 : 1 }}>
                            {dim ? "SCR" : r.rating.toFixed(1)}
                          </span>
                          <button onClick={() => (scratchMode ? toggleScratch(r.i) : winnerMode ? (!dim && logWinner(r)) : setExpanded(expanded === r.i ? null : r.i))}
                            style={{ background: "none", border: "none", color: "#EFE8D5", cursor: "pointer", textAlign: "left", padding: 0, minWidth: 0, fontWeight: 700, fontSize: 13, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textDecoration: dim ? "line-through" : "none" }}>
                            {!dim && <span style={{ fontWeight: 400, color: "#B9C8BB" }}>{r.ratingRank} · </span>}
                            {r.name}{isBest ? " ★" : ""}
                            {r.post && <span style={{ fontWeight: 400, color: "#B9C8BB", fontSize: 11 }}> p{r.post}</span>}
                          </button>
                          <span style={{ ...lcdFont, background: dim ? "transparent" : "#86917E", borderRadius: 5, padding: "3px 5px", fontSize: 12, textAlign: "center", boxShadow: dim ? "none" : "inset 0 2px 4px rgba(0,0,0,0.25)", color: dim ? "#8FA396" : LCD_INK }}>
                            {r.fair !== null ? r.fair.toFixed(1) : "—"}
                          </span>
                          {dim ? <span style={{ color: "#8FA396", fontSize: 11, textAlign: "center" }}>—</span> : (
                            <input value={horses[r.i]?.mlOdds ?? ""} onChange={(e) => updateHorse(r.i, "mlOdds", e.target.value)}
                              placeholder="5-2" aria-label={`Odds for ${r.name}`} inputMode="decimal"
                              style={{ background: LCD_BG, ...lcdFont, fontSize: 12, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 5, padding: "3px 4px", width: "100%", textAlign: "center", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
                          )}
                          <span style={{ fontWeight: 700, fontSize: 12, color: edgeColor, fontVariantNumeric: "tabular-nums", textAlign: "right" }}>
                            {r.edge !== null ? (r.edge > 0 ? "+" : "") + (r.edge * 100).toFixed(0) + "%" : "—"}
                          </span>
                          <span style={{ fontSize: 12, color: "#CFDCCF", fontVariantNumeric: "tabular-nums" }}>{r.pModel !== null ? (r.pModel * 100).toFixed(0) + "%" : "—"}</span>
                          <span style={{ fontSize: 12, color: "#CFDCCF", fontVariantNumeric: "tabular-nums" }}>{r.pPlace !== null ? (r.pPlace * 100).toFixed(0) + "%" : "—"}</span>
                          <span style={{ fontSize: 12, color: "#CFDCCF", fontVariantNumeric: "tabular-nums" }}>{r.pShow !== null ? (r.pShow * 100).toFixed(0) + "%" : "—"}</span>
                        </div>
                        {expanded === r.i && (
                          <div style={{ padding: "0 12px 9px 12px", fontSize: 12, color: "#CFDCCF" }}>
                            {Object.entries(r.components).map(([k, v]) => (
                              <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                                <span>{COMPONENT_LABELS[k]}</span>
                                <span style={{ fontVariantNumeric: "tabular-nums" }}>{Math.round(v * 10) / 10}</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {winnerMode && (
                <div style={{ background: "rgba(227,201,140,0.12)", border: "1px solid rgba(227,201,140,0.5)", borderRadius: 8, padding: "10px 12px", fontSize: 13, margin: "4px 0 10px" }}>
                  Race is official? Tap the winning horse above to log this race's predictions and result.
                </div>
              )}
              {scratchMode && (
                <div style={{ background: "rgba(227,201,140,0.12)", border: "1px solid rgba(227,201,140,0.5)", borderRadius: 8, padding: "10px 12px", fontSize: 13, margin: "4px 0 10px" }}>
                  Tap a horse to scratch it (tap again to restore). Chances re-spread over the remaining field.
                </div>
              )}
              {logMsg && (
                <div style={{ background: "rgba(143,196,159,0.12)", border: "1px solid rgba(143,196,159,0.5)", borderRadius: 8, padding: "10px 12px", fontSize: 13, margin: "4px 0 10px" }}>
                  ✓ {logMsg}
                </div>
              )}
              <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
                <Key wide red onClick={() => { setSortMode("edge"); setExpanded(null); }}>Re-analyze · sort by value</Key>
                {supaUrl && supaKey && (
                  <Key onClick={() => { setWinnerMode(!winnerMode); setLogMsg(""); }}>{winnerMode ? "Cancel logging" : "Log result"}</Key>
                )}
                {sortMode === "edge" && <Key onClick={() => setSortMode("rating")}>Sort by rating</Key>}
                <Key onClick={() => setStep("review")}>Edit entries</Key>
                <Key onClick={() => { setStep("start"); setHorses([]); setRaceIndex([]); setRaceData({}); setActiveRace(null); setWinnerMode(false); setLogMsg(""); brisRef.current = null; setLcdMsg("READY"); setError(""); }}>New card</Key>
              </div>
              <p style={{ fontSize: 11, color: "#B9C8BB", marginTop: 16, lineHeight: 1.55 }}>
                ★ = biggest positive edge. Numbered badges always show the machine's rating rank. Model % is an
                approximation from the ratings, not a calibrated probability, and the track keeps 15–20% of the pool —
                treat edges as signals to investigate, not sure things. In the words of the original manual: some
                unknowns just can't be predicted. This is a period-style analytical toy, not betting advice.
              </p>
            </div>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 14, ...labelFont, color: "#7A756A" }}>
          🏇 For thoroughbreds, 6 furlongs or more · no maiden races
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HorseRaceAnalyzer />);
</script>
</body>
</html>
