          {/* file pickers live on every screen so any button can open them */}
          <input ref={fileRef} type="file" multiple onChange={(e) => handleFiles(e.target.files)} style={{ display: "none" }} />
          <input ref={scanFileRef} type="file" multiple onChange={(e) => handleScanFiles(e.target.files)} style={{ display: "none" }} />
          <input ref={oddsSnapRef} type="file" accept="image/*" multiple onChange={(e) => handleOddsSnap(e.target.files)} style={{ display: "none" }} />

          {cardTitle && step !== "start" && (
            <div style={{ ...labelFont, color: "#6B6353", marginBottom: 10 }}>{cardTitle}</div>
          )}

          {error && (
            <div style={{ background: "#F4D9D2", border: `1px solid ${RED}`, borderRadius: 8, padding: "10px 12px", fontSize: 13, marginBottom: 14, lineHeight: 1.45, wordBreak: "break-word" }}>
              {error}
            </div>
          )}

          {/* ---------- START ---------- */}
          {/* ---------- SLIPS ---------- */}
          {step === "slips" && slipsView && (
            <div>
              <h2 style={{ fontSize: 15, letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 4px" }}>Betting slips — the table</h2>
              <p style={{ fontSize: 11, color: "#6B6353", margin: "0 0 14px", lineHeight: 1.5 }}>
                Every ticket, face up. Live tickets can be cancelled; settled tickets are history.
              </p>
              {(() => {
                const dates = [...new Set(slipsView.map((b) => b.race_date))].filter(Boolean);
                return dates.length > 1 ? (
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                    {[null, ...dates].map((d) => (
                      <button key={d || "all"} onClick={() => setSlipsDate(d)}
                        style={{ background: slipsDate === d ? GREEN_DARK : "#EAE3CF", color: slipsDate === d ? "#F3EDDD" : "#4A4437", border: slipsDate === d ? "1px solid rgba(0,0,0,0.5)" : "1px solid rgba(0,0,0,0.25)", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {d ? ymdToDisplay(d) : "All"}
                      </button>
                    ))}
                  </div>
                ) : null;
              })()}
              {slipsView.length === 0 && (
                <div style={{ background: "#EAE3CF", borderRadius: 8, padding: 14, fontSize: 13, color: "#6B6353", marginBottom: 10 }}>
                  No tickets yet — punch one from a race with 🎟 Bet.
                </div>
              )}
              <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginBottom: 14 }}>
                {slipsView.filter((b) => !slipsDate || b.race_date === slipsDate).map((b) => (
                  <div key={b.id} style={{ background: "#F2E8D0", color: "#3A3226", borderRadius: 4, padding: "10px 13px", width: 250, fontFamily: "'Courier New', monospace", border: "1px solid #C9B98F", borderTop: "3px dashed #C9B98F", borderBottom: "3px dashed #C9B98F", boxShadow: "0 3px 8px rgba(0,0,0,0.35)", transform: `rotate(${((b.id % 5) - 2) * 0.8 + (b.settled ? 1.3 : 0)}deg)`, opacity: b.settled ? 0.5 : 1, clipPath: b.settled ? "polygon(0 0, 100% 0, 100% 93%, 95% 100%, 89% 94%, 83% 100%, 77% 94%, 71% 100%, 65% 94%, 59% 100%, 53% 94%, 47% 100%, 41% 94%, 35% 100%, 29% 94%, 23% 100%, 17% 94%, 11% 100%, 5% 94%, 0 100%)" : "none", position: "relative" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, letterSpacing: "0.08em" }}>
                      <span>{b.track} · R{b.race_no} · {ymdToDisplay(b.race_date)}</span>
                      <span style={{ color: "#A33327", fontWeight: 700 }}>GGF-{String(b.id).padStart(5, "0")}</span>
                    </div>
                    <div style={{ fontSize: 13, fontWeight: 700, margin: "7px 0 3px" }}>
                      {b.bet_type} ${Number(b.amount).toFixed(2)} — #{b.post} {String(b.horse).toUpperCase()}
                    </div>
                    <div style={{ fontSize: 10, color: "#6B5F49" }}>
                      {b.odds_at_bet ? `${b.odds_at_bet} taken` : "odds n/a"}{b.fair ? ` · fair ${b.fair}` : ""}{b.edge !== null ? ` · edge ${b.edge > 0 ? "+" : ""}${b.edge}%` : ""}
                    </div>
                    <div style={{ marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      {b.settled ? (
                        <span style={{ fontWeight: 700, fontSize: 13, letterSpacing: "0.1em", color: isRefund(b) ? "#6B6350" : b.won ? "#2E6B45" : "#A33327", border: `2px solid ${isRefund(b) ? "#6B6350" : b.won ? "#2E6B45" : "#A33327"}`, borderRadius: 3, padding: "3px 8px", transform: "rotate(-4deg)" }}>
                          {isRefund(b) ? "REFUNDED" : b.won ? `WON${b.payout ? ` $${Number(b.payout).toFixed(2)}` : ""}` : "LOST"}
                        </span>
                      ) : (
                        <button onClick={() => cancelSlip(b)}
                          style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 10, letterSpacing: "0.1em", padding: "3px 9px", borderRadius: 3, cursor: "pointer", background: "transparent", color: "#A33327", border: "2px solid #A33327" }}>
                          CANCEL
                        </button>
                      )}
                      <span style={{ fontSize: 9, color: "#8B7D63" }}>{b.settled ? "SETTLED" : "LIVE"}</span>
                    </div>
                  </div>
                ))}
              </div>
              {(() => {
                const shown = slipsView.filter((b) => !slipsDate || b.race_date === slipsDate);
                const settled = shown.filter((b) => b.settled);
                const staked = shown.reduce((a, b) => a + Number(b.amount || 0), 0);
                const returned = settled.reduce((a, b) => a + Number(b.payout || 0), 0);
                const pendingPayout = settled.filter((b) => b.won && (b.payout === null || b.payout === undefined)).length;
                const net = returned - settled.reduce((a, b) => a + Number(b.amount || 0), 0);
                return shown.length > 0 ? (
                  <div style={{ fontSize: 12, color: "#4A4437", marginBottom: 12 }}>
                    Staked ${staked.toFixed(2)} · Returned ${returned.toFixed(2)} · Net on settled {net >= 0 ? "+" : ""}${net.toFixed(2)}
                    {pendingPayout ? ` · ${pendingPayout} winner${pendingPayout > 1 ? "s" : ""} awaiting payout entry` : ""}
                  </div>
                ) : null;
              })()}
            </div>
          )}

          {/* ---------- CARDS ---------- */}
          {step === "cards" && (
            <div>
              <h2 style={{ fontSize: 15, letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 4px" }}>Cards on file</h2>
              <p style={{ fontSize: 11, color: "#6B6353", margin: "0 0 12px", lineHeight: 1.5 }}>
                Uploaded Brisnet data files save here automatically. Open races through Race Day.
              </p>
              {(() => {
                const dates = [...new Set((savedCards || []).map((c) => c.race_date))].filter(Boolean).sort().reverse();
                return dates.length > 1 ? (
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                    {[null, ...dates].map((d) => (
                      <button key={d || "all"} onClick={() => { setCardsDate(d); bindStripToDate(d, savedCards, "CARDS ON FILE"); }}
                        style={{ background: cardsDate === d ? GREEN_DARK : "#EAE3CF", color: cardsDate === d ? "#F3EDDD" : "#4A4437", border: cardsDate === d ? "1px solid rgba(0,0,0,0.5)" : "1px solid rgba(0,0,0,0.25)", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {d ? ymdToDisplay(d) : "All"}
                      </button>
                    ))}
                  </div>
                ) : null;
              })()}
              {(!savedCards || savedCards.length === 0) && (
                <div style={{ background: "#EAE3CF", borderRadius: 8, padding: 14, fontSize: 13, color: "#6B6353", marginBottom: 10 }}>
                  Nothing saved yet — tap "Upload Cards" below with a Brisnet data file.
                </div>
              )}
              {(savedCards || []).filter((c) => !cardsDate || c.race_date === cardsDate).map((c) => (
                <div key={c.id} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                  <button onClick={() => loadSavedCard(c.id, undefined, "CARDS ON FILE")} disabled={busy}
                    style={{ flex: 1, display: "flex", justifyContent: "space-between", gap: 10, padding: "10px 12px", borderRadius: 8, border: "1px solid rgba(0,0,0,0.35)", background: "#EAE3CF", color: "#2E2A20", cursor: "pointer", fontSize: 13, textAlign: "left", opacity: c.cancelled ? 0.55 : 1 }}>
                    <b>{c.cancelled ? "\u25e6" : "\u2713"} {c.title || (c.track + " " + c.race_date)}</b>
                    <span style={{ color: c.cancelled ? "#9C5F1E" : "#6B6353", fontSize: 11, whiteSpace: "nowrap" }}>
                      {c.cancelled ? "no racing" : (c.updated_at || "").slice(0, 10)}
                    </span>
                  </button>
                  <button onClick={() => toggleCardCancelled(c, !c.cancelled)} disabled={busy}
                    title={c.cancelled ? "Restore this card" : "Mark this card cancelled \u2014 no racing"}
                    style={{ width: 44, borderRadius: 8, border: "1px solid rgba(0,0,0,0.35)", background: "#EAE3CF", color: c.cancelled ? "#2F7A46" : "#A83226", cursor: "pointer", fontSize: 15, fontWeight: 700 }}>
                    {c.cancelled ? "\u21ba" : "\u2715"}
                  </button>
                </div>
              ))}
            </div>
          )}

          {/* ---------- AUDIT ---------- */}
          {step === "audit" && auditView && (
            <div>
              <h2 style={{ fontSize: 15, letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 4px" }}>The audit — books vs. track</h2>
              <p style={{ fontSize: 11, color: "#6B6353", margin: "0 0 14px", lineHeight: 1.5 }}>
                Every race date reconciled across cards, results, and tickets. Green means the day is closed clean.
              </p>
              {auditView.length === 0 && (
                <div style={{ background: "#EAE3CF", borderRadius: 8, padding: 14, fontSize: 13, color: "#6B6353" }}>
                  Nothing on the books yet.
                </div>
              )}
              {auditView.map((day) => (
                <div key={day.date} style={{ background: "#EAE3CF", borderRadius: 8, padding: "10px 12px", marginBottom: 10, border: day.allOff ? "1px solid rgba(0,0,0,0.15)" : day.clean ? "1px solid rgba(122,163,122,0.6)" : "1px solid rgba(0,0,0,0.35)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10, marginBottom: 6 }}>
                    <b style={{ fontSize: 14, letterSpacing: "0.06em" }}>{day.date.length === 8 ? day.date.slice(4, 6) + "/" + day.date.slice(6, 8) + "/" + day.date.slice(0, 4) : day.date}</b>
                    <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", color: day.allOff ? "#6B6353" : day.clean ? "#2F7A46" : GOLD }}>
                      {day.allOff ? "\u25e6 NO RACING" : day.clean ? "\u2713 CLOSED CLEAN" : "OPEN ITEMS"}
                    </span>
                  </div>
                  {day.tracks.length === 0 && (
                    <div style={{ fontSize: 12, color: "#9C5F1E" }}>No card on file for this date — {day.orphans} ticket(s) and/or log rows with nothing to reconcile against.</div>
                  )}
                  {day.tracks.map((t) => (
                    <div key={t.track} style={{ padding: "7px 0", borderTop: "1px solid rgba(0,0,0,0.09)", fontSize: 12, lineHeight: 1.6 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                        <b style={{ opacity: t.cardOff ? 0.6 : 1 }}>{t.track}</b>
                        <span style={{ color: t.cardOff ? "#6B6353" : t.clean ? "#2F7A46" : "#6B6353" }}>
                          {t.cardOff ? "card cancelled \u2014 no racing" : `${t.logged}/${t.elig} eligible races logged \u00b7 ${t.tickets} ticket${t.tickets === 1 ? "" : "s"}`}
                        </span>
                      </div>
                      {!t.cardOff && t.notRun.length > 0 && (
                        <div style={{ color: "#6B6353" }}>Did not run: {t.notRun.map((n) => "R" + n).join(", ")}</div>
                      )}
                      {t.unlogged.length > 0 && (
                        <div style={{ color: "#A83226" }}>{t.unlogged.length} race{t.unlogged.length === 1 ? "" : "s"} unlogged: {t.unlogged.map((n) => "R" + n).join(", ")}</div>
                      )}
                      {t.missingPay.length > 0 && (
                        <div style={{ color: "#9C5F1E" }}>Winner missing payout: {t.missingPay.map((n) => "R" + n).join(", ")}</div>
                      )}
                      {t.unsettled > 0 && (
                        <div style={{ color: "#A83226" }}>{t.unsettled} ticket{t.unsettled === 1 ? "" : "s"} not settled</div>
                      )}
                      {t.stray.length > 0 && (
                        <div style={{ color: "#A83226" }}>Tickets on non-eligible races: {t.stray.map((n) => "R" + n).join(", ")}</div>
                      )}
                      {t.clean && t.tickets > 0 && (
                        <div style={{ color: "#6B6353" }}>Settled: staked ${t.staked.toFixed(2)} → returned ${t.returned.toFixed(2)}</div>
                      )}
                      {t.dupRaces && t.dupRaces.length > 0 && (
                        <div style={{ color: "#A83226" }}>
                          Duplicate log rows: {t.dupRows} extra on race{t.dupRaces.length === 1 ? " " : "s "}{t.dupRaces.join(", ")} — the refit would count {t.dupRaces.length === 1 ? "it" : "them"} twice
                        </div>
                      )}
                      {(t.noRating > 0 || t.noOdds > 0) ? (
                        <div style={{ color: "#9C5F1E" }}>
                          Calibration gaps:{t.noRating > 0 ? ` ${t.noRating} row${t.noRating === 1 ? "" : "s"} missing rating/model %` : ""}{t.noRating > 0 && t.noOdds > 0 ? " ·" : ""}{t.noOdds > 0 ? ` ${t.noOdds} row${t.noOdds === 1 ? "" : "s"} missing odds` : ""}
                        </div>
                      ) : t.rows > 0 ? (
                        <div style={{ color: "#7E9587", fontSize: 10 }}>Calibration-ready: {t.rows} log rows, all with rating, model %, and odds</div>
                      ) : null}
                    </div>
                  ))}
                  {day.orphans > 0 && day.tracks.length > 0 && (
                    <div style={{ fontSize: 12, color: "#A83226", paddingTop: 6 }}>{day.orphans} orphaned ticket(s) — no card on file for their track</div>
                  )}
                  {day.entCount > 0 && (
                    <div style={{ fontSize: 10, color: "#7E9587", paddingTop: 4 }}>{day.entCount} entries scan{day.entCount === 1 ? "" : "s"} on file</div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* ---------- TODAY ---------- */}
          {step === "today" && dayView && (
            <div>
              <h2 style={{ fontSize: 15, letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 4px" }}>Race Day — {dayView.date}</h2>
              <p style={{ fontSize: 11, color: "#6B6353", margin: "0 0 10px", lineHeight: 1.5 }}>
                Eligible races from your uploaded cards, in post-time order. Tap one to open it.
              </p>
              {dayView.dates.length > 1 && (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                  {dayView.dates.map((d) => (
                    <button key={d} onClick={() => buildRaceCard(dayCards || [], d)} disabled={busy}
                      style={{ background: d === dayView.ymd ? GREEN_DARK : "#EAE3CF", color: d === dayView.ymd ? "#F3EDDD" : "#4A4437", border: d === dayView.ymd ? "1px solid rgba(0,0,0,0.5)" : "1px solid rgba(0,0,0,0.25)", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                      {ymdToDisplay(d)}
                    </button>
                  ))}
                </div>
              )}
              {dayView.items.length === 0 && (
                <div style={{ background: "#EAE3CF", borderRadius: 8, padding: 14, fontSize: 13, color: "#6B6353", marginBottom: 10 }}>
                  No eligible races on this date's cards.
                </div>
              )}
              {dayView.items.map((it, ii) => (
                <div key={ii} style={{ display: "flex", gap: 6, marginBottom: 5 }}>
                <button onClick={() => { raceOriginRef.current = "today"; loadSavedCard(it.cardId, it.raceNumber); }} disabled={busy || it.cancelled}
                  style={{ flex: 1, display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: 8, border: "1px solid rgba(0,0,0,0.3)", background: "#EAE3CF", color: "#2E2A20", cursor: it.cancelled ? "default" : "pointer", textAlign: "left", fontSize: 13, opacity: it.cancelled ? 0.5 : 1 }}>
                  <span style={{ ...lcdFont, background: LCD_BG, borderRadius: 5, padding: "3px 7px", fontSize: 12, minWidth: 62, textAlign: "center", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }}>
                    {it.postTime || "—"}
                  </span>
                  <b style={{ minWidth: 66 }}>{it.track} R{it.raceNumber}</b>
                  <span style={{ minWidth: 66, color: "#4A4437" }}>{it.distanceFurlongs}f {it.surface}</span>
                  <span style={{ flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{it.type}{it.horseCount ? ` · ${it.horseCount} horses` : ""}{it.scrCount ? ` · ${it.scrCount} scr` : ""}</span>
                  {(() => {
                    const bets = it.bets || [];
                    if (it.cancelled) return <span style={{ fontSize: 11, color: "#9C5F1E", whiteSpace: "nowrap" }}>{it.cardOff ? "Card cancelled" : "No race"}</span>;
                    if (it.run) {
                      if (!bets.length) return <span style={{ fontSize: 11, color: "#8B8168", whiteSpace: "nowrap" }}>Race Run ✓</span>;
                      const settled = bets.filter((b) => b.settled);
                      const net = settled.reduce((a, b) => a + Number(b.payout || 0) - Number(b.amount || 0), 0);
                      const pend = settled.some((b) => b.won && (b.payout === null || b.payout === undefined));
                      if (settled.length && settled.every((b) => !b.won && Number(b.payout) === Number(b.amount) && Number(b.amount) > 0)) return <span style={{ fontSize: 11, fontWeight: 700, color: "#6B6353", whiteSpace: "nowrap" }}>Refunded · scratched</span>;
                      if (settled.some((b) => b.won)) return <span style={{ fontSize: 11, fontWeight: 700, color: "#2F7A46", whiteSpace: "nowrap" }}>{pend ? "Won · payout?" : `Won ${net >= 0 ? "+" : "−"}$${Math.abs(net).toFixed(2)}`}</span>;
                      return <span style={{ fontSize: 11, fontWeight: 700, color: "#D08770", whiteSpace: "nowrap" }}>Lost −${Math.abs(net).toFixed(2)}</span>;
                    }
                    if (bets.length) return <span style={{ fontSize: 11, fontWeight: 700, color: "#8A6D2F", whiteSpace: "nowrap" }}>Bet Placed ({bets.length})</span>;
                    return null;
                  })()}
                </button>
                {!it.cardOff && (
                  <button onClick={() => toggleRaceCancelled(it, !it.cancelled)} disabled={busy}
                    title={it.cancelled ? "Restore this race" : "Mark this race as not run"}
                    style={{ width: 40, borderRadius: 8, border: "1px solid rgba(0,0,0,0.3)", background: "#EAE3CF", color: it.cancelled ? "#2F7A46" : "#8B8168", cursor: "pointer", fontSize: 14, fontWeight: 700 }}>
                    {it.cancelled ? "\u21ba" : "\u2715"}
                  </button>
                )}
                </div>
              ))}
            </div>
          )}

          {/* ---------- DAY SCAN ---------- */}
          {step === "scan" && dayScan && (
            <div>
              {scanNote && (
                <div style={{ background: "rgba(138,109,47,0.12)", border: "1px solid rgba(138,109,47,0.5)", borderRadius: 8, padding: "9px 12px", fontSize: 12, marginBottom: 12, lineHeight: 1.5 }}>
                  {scanNote}
                </div>
              )}
              <h2 style={{ fontSize: 15, letterSpacing: "0.12em", textTransform: "uppercase", margin: "0 0 4px" }}>Entries — shopping list</h2>
              <p style={{ fontSize: 11, color: "#6B6353", margin: "0 0 14px", lineHeight: 1.5 }}>
                Tracks with qualifying races are worth a data file at brisnet.com. Post times shown for planning.
              </p>
              {(() => {
                const dates = [...new Set(dayScan.map((t) => t.ymd))].filter(Boolean).sort().reverse();
                return dates.length > 1 ? (
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                    {[null, ...dates].map((d) => (
                      <button key={d || "all"} onClick={() => { setEntriesDate(d); bindStripToDate(d, ownedCards, "ENTRIES ON FILE"); }}
                        style={{ background: entriesDate === d ? GREEN_DARK : "#EAE3CF", color: entriesDate === d ? "#F3EDDD" : "#4A4437", border: entriesDate === d ? "1px solid rgba(0,0,0,0.5)" : "1px solid rgba(0,0,0,0.25)", borderRadius: 999, padding: "5px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {d ? ymdToDisplay(d) : "All"}
                      </button>
                    ))}
                  </div>
                ) : null;
              })()}
              {dayScan.length === 0 && (
                <div style={{ background: "#EAE3CF", borderRadius: 8, padding: 14, fontSize: 13, color: "#6B6353", marginBottom: 10 }}>
                  Nothing on file yet — tap "Upload Entries" with saved entries-page PDFs.
                </div>
              )}
              {dayScan.filter((t) => !entriesDate || !t.ymd || t.ymd === entriesDate).map((t, ti) => {
                const ok = (t.races || []).filter((r) => r.ok);
                const owned = (t.ymd && ownedCards.find((c) => c.race_date === t.ymd && (t.code ? c.track === t.code : trackMatches(c.track, t.track)))) || null;
                return (
                  <div key={ti} style={{ background: "#EAE3CF", borderRadius: 8, padding: 12, marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
                      <b style={{ fontSize: 14 }}>{t.track}{t.dateStr ? <span style={{ fontWeight: 400, color: "#6B6353", fontSize: 12 }}> · {t.dateStr}</span> : null}</b>
                      <span style={{ fontSize: 11, color: owned ? "#2F7A46" : ok.length ? "#8A6D2F" : "#8B8168" }}>
                        {t.error ? t.error : owned ? (
                          <span>
                            {ok.length} of {t.races.length} qualify —{" "}
                            <span style={{ color: "#2F7A46", fontWeight: 700, fontSize: 11 }}>✓ card on file</span>
                          </span>
                        ) : ok.length ? (
                          <span>
                            {ok.length} of {t.races.length} qualify —{" "}
                            <a href="https://www.brisnet.com/product/data-files" target="_blank" rel="noopener noreferrer"
                              style={{ color: "#8A6D2F", fontWeight: 700, textDecoration: "underline" }}>
                              buy this card ↗
                            </a>
                          </span>
                        ) : `${ok.length} of ${t.races.length} qualify — pass`}
                      </span>
                    </div>
                    {(t.races || []).map((r) => (
                      <div key={r.raceNumber} style={{ display: "flex", gap: 10, fontSize: 12, padding: "3px 0", color: r.ok ? "#2E2A20" : "#6E8378", borderBottom: "1px solid rgba(0,0,0,0.06)" }}>
                        <span style={{ minWidth: 30, fontWeight: 700 }}>R{r.raceNumber}</span>
                        <span style={{ minWidth: 62 }}>{r.postTime || "—"}</span>
                        <span style={{ minWidth: 70 }}>{r.distanceFurlongs}f {r.surface}</span>
                        <span style={{ flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.type}{r.fieldSize ? ` · ${r.fieldSize} horses` : ""}</span>
                        {!r.ok && <span style={{ fontSize: 11 }}>{r.reason}</span>}
                      </div>
                    ))}
                  </div>
                );
              })}

                  </div>
                  {displayed.map((r, di) => {
                    const isBest = !loggedRaces[num(raceInfo.raceNumber)] && bestEdge && r.i === bestEdge.i && r.edge !== null && r.edge > 0 && ["WIN", "PLACE", "SHOW"].includes(verdict.action);

                    return (
                      <div key={r.i} style={{ background: isBest ? "rgba(138,109,47,0.12)" : "none", borderRadius: 0, marginBottom: 0, opacity: dim ? 0.45 : 1, borderBottom: "1px solid rgba(0,0,0,0.16)" }}>
                        <div style={{ display: "grid", gridTemplateColumns: "34px 58px minmax(130px, 1fr) 46px 54px 58px 44px 44px 44px 26px", gap: 6, alignItems: "center", padding: "6px 10px", background: winnerMode ? "rgba(138,109,47,0.06)" : "none" }}>

                            <button onClick={(e) => { e.stopPropagation(); openBetSlip(); }} title={`Bet ${r.name}`}

                            {r.post && <span style={{ fontWeight: 400, color: "#6B6353" }}>{r.post} · </span>}
                            {r.name}{isBest ? " ★" : ""}

                                {["1ST", "2ND", "3RD"][finishPicks.indexOf(r.i)]}
                              </span>

                            {!winnerMode && (() => {

                            <input value={horses[r.i]?.mlOdds ?? ""} onChange={(e) => { updateHorse(r.i, "mlOdds", e.target.value); scheduleAsk(1500); }}

                              onKeyDown={(e) => {
                                if (e.key === "Enter" || e.key === "Tab") {

                                  const dir = e.shiftKey ? -1 : 1;
                                  for (let j = di + dir; j >= 0 && j < displayed.length; j += dir) {
                                    const el = oddsRefs.current[j];

                                  return;

                                if (e.currentTarget.dataset.fresh === "1") {
                                  e.currentTarget.dataset.fresh = "0";
                                  if (e.key.length === 1) {
                                    e.preventDefault();
                                    updateHorse(r.i, "mlOdds", e.key);

                              placeholder="5-2" aria-label={`Odds for ${r.name}`} inputMode="decimal"
                              style={{ background: LCD_BG, ...lcdFont, fontSize: 12, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 5, padding: "3px 4px", width: "100%", textAlign: "center", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
                          )}

                          <span style={cell}>{r.pShow !== null ? (r.pShow * 100).toFixed(0) + "%" : "—"}</span>
                          {/* 2.16.0: scratch lives on the row, like the cancel on a Race Day line.

                          <button onClick={(e) => { e.stopPropagation(); toggleScratch(r.i); }} disabled={winnerMode}
                            title={dim ? "Restore this horse" : "Scratch this horse"}
                            style={{ background: "none", border: "none", color: dim ? "#2F7A46" : "#8B8168", cursor: winnerMode ? "default" : "pointer", fontSize: 13, padding: "2px 4px", opacity: winnerMode ? 0.25 : 1, lineHeight: 1 }}>
                            {dim ? "\u21ba" : "\u2715"}
                          </button>
                        </div>
                        {winnerMode && finishPicks.includes(r.i) && (() => {
                          const pos = finishPicks.indexOf(r.i);
                          // 2.15.4: the tote board reads in columns — $2 Win, $2 Place, $2 Show —
                          // and a horse that ran second has an empty Win column, not a Place figure
                          // shifted left under the Win header. Fixed slots, blanks where no pool paid.
                          const slots = [pos === 0 ? "w1" : null, pos === 0 ? "p1" : pos === 1 ? "p2" : null,
                            pos === 0 ? "s1" : pos === 1 ? "s2" : "s3"];
                          return (
                            <div style={{ padding: "4px 10px 8px 68px", background: "rgba(138,109,47,0.06)" }}>

                                  : <input key={k} value={resultPays[k]} onChange={(e) => setResultPays((prev) => ({ ...prev, [k]: e.target.value }))}
                                      inputMode="decimal" onClick={(e) => e.stopPropagation()}
                                      style={{ background: LCD_BG, ...lcdFont, fontSize: 11, border: "1px solid rgba(0,0,0,0.4)", borderRadius: 5, padding: "4px 6px", width: 74, textAlign: "center", boxShadow: "inset 0 2px 4px rgba(0,0,0,0.3)" }} />
                                ))}
                                {pos === 2 && <span style={{ fontSize: 10, color: "#8B8168" }}>per $2, from the tote board — optional</span>}
                              </div>
                            </div>
                          );
                        })()}
                        {expanded === r.i && (() => {
                          const h = horses[r.i] || {};
                          const fd = (d) => (d && d.length === 8 ? `${parseInt(d.slice(4, 6), 10)}/${parseInt(d.slice(6, 8), 10)}/${d.slice(2, 4)}` : d || "");
                          return (
                            <div style={{ padding: "0 12px 10px 12px", fontSize: 12, color: "#4A4437" }}>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 18px", padding: "2px 0 8px", borderBottom: "1px solid rgba(0,0,0,0.09)" }}>
                                {h.trainer && <span><span style={{ color: "#8B8168" }}>Trainer</span> {h.trainer}</span>}
                                {h.jockey && <span><span style={{ color: "#8B8168" }}>Jockey</span> {h.jockey}</span>}
                                {h.runStyle && <span><span style={{ color: "#8B8168" }}>Style</span> {h.runStyle}{h.quirinPts ? ` (${h.quirinPts} Quirin pts)` : ""}</span>}
                                {h.primePower && <span><span style={{ color: "#8B8168" }}>Prime Power</span> {h.primePower}</span>}
                                {h.sire && <span><span style={{ color: "#8B8168" }}>Breeding</span> {h.sire} — {h.dam}{h.bredIn ? ` (${h.bredIn})` : ""}</span>}
                              </div>
                              {h.history && h.history.length > 0 && (
                                <div style={{ padding: "8px 0", borderBottom: "1px solid rgba(0,0,0,0.09)" }}>
                                  <div style={{ display: "grid", gridTemplateColumns: "64px 44px 60px 70px 40px", gap: 8, ...labelFont, color: "#8B8168", paddingBottom: 3 }}>
                                    <span>Date</span><span>Trk</span><span>Dist</span><span>Finish</span><span style={{ textAlign: "right" }}>Fig</span>
                                  </div>
                                  {h.history.map((pr, k) => (
                                    <div key={k} style={{ display: "grid", gridTemplateColumns: "64px 44px 60px 70px 40px", gap: 8, padding: "2px 0", fontVariantNumeric: "tabular-nums" }}>

                                      <span>{pr.track}</span>
                                      <span>{pr.distF !== null ? pr.distF + "f" : "—"}{pr.surface === "T" ? " ⓣ" : ""}</span>
                                      <span>{pr.fin !== null ? (pr.fin === 1 ? "won" : `${pr.fin}${["st","nd","rd"][pr.fin-2] || "th"}`) : "—"}{pr.lebFin !== null && pr.fin !== 1 ? ` (${pr.lebFin}L)` : ""}</span>
                                      <span style={{ textAlign: "right" }}>{pr.spd !== null ? pr.spd : "—"}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                              {(() => {
                                const lr = h.lastRace || {}, pr = h.priorRace || {};
                                const eps = Math.round((num(h.earnings) || 0) / Math.max(num(h.racesThisYear) || 1, 1));
                                const caps = {
                                  earlySpeed: `1st-call lengths behind: ${lr.lengthsBehindFirstCall || "—"} / ${pr.lengthsBehindFirstCall || "—"} (last two races)`,
                                  recentForm: `last race: finished ${lr.finishPosition || "—"}, ${lr.lengthsBehindFinish || "—"}L at the wire`,
                                  speed: `figures ${lr.speedRating || "—"} / ${pr.speedRating || "—"}`,
                                  class: `$${eps.toLocaleString()}/start vs $${Number(raceInfo.purse || 0).toLocaleString()} purse`,
                                  consistency: `${h.wins || 0}-${h.places || 0}-${h.shows || 0} in ${h.racesThisYear || 0} starts`,
                                  freshness: `${h.daysSinceLastRace || "—"} days since last race`,
                                  post: `post ${h.postPosition || "—"} at ${raceInfo.distanceFurlongs || "?"}f`,
                                };
                                const warns = [];
                                const today = raceInfo.surface || "dirt";
                                const recent = (h.history || []).slice(0, 2).map((x) => x.surface);
                                if (recent.length && recent.every((x) => x === "T") && today === "dirt") warns.push("Rating built on turf races — today is dirt. The 1979 formula can't see surface switches.");
                                if (recent.length && recent.every((x) => x === "D") && today === "turf") warns.push("Rating built on dirt races — today is turf.");
                                if (!num(lr.speedRating)) warns.push("No last-race speed figure — the speed component is underscored, not necessarily bad form.");
                                const dd = num(h.daysSinceLastRace);
                                if (dd !== null && dd > 90) warns.push(`Long layoff: ${dd} days — freshness scores near zero.`);
                                const rr = num(h.racesThisYear);
                                if (rr !== null && rr <= 1) warns.push("Thin current-year record — class and consistency score near zero.");
                                const wh = raceWatch.find((w) => w.horse.toUpperCase() === String(r.name).toUpperCase());
                                if (wh) warns.push(`Brisnet Scratch Watch: ${wh.reason} — a likely (not official) scratch. Use the Scratch button only when it's confirmed.`);
                                return (
                                  <div style={{ paddingTop: 6 }}>
                                    {warns.length > 0 && (
                                      <div style={{ background: "rgba(138,109,47,0.10)", border: "1px solid rgba(138,109,47,0.4)", borderRadius: 6, padding: "8px 10px", fontSize: 11, lineHeight: 1.5, marginBottom: 8, color: "#E8DAB0" }}>
                                        {warns.map((w, wi) => <span key={wi} style={{ display: "block" }}>⚠ {w}</span>)}
                                      </div>
                                    )}
                                    {Object.entries(r.components).map(([k, v]) => (
                                      <div key={k} style={{ padding: "3px 0", borderBottom: "1px solid rgba(0,0,0,0.07)" }}>
                                        <div style={{ display: "flex", justifyContent: "space-between" }}>
                                          <span>{COMPONENT_LABELS[k]}</span>
                                          <span style={{ fontVariantNumeric: "tabular-nums" }}>{Math.round(v * 10) / 10}</span>
                                        </div>
                                        <div style={{ fontSize: 10, color: "#8B8168" }}>{caps[k]}</div>
                                      </div>
                                    ))}
                                    <div style={{ fontSize: 10, color: "#8B8168", paddingTop: 5 }}>
                                      The rating scores only the two most recent races; older lines above are context.
                                    </div>
                                  </div>
                                );
                              })()}
                            </div>
                          );
                        })()}
                      </div>
                    );
                  })}
                </div>
              </div>

              {winnerMode && (
                <div style={{ background: "rgba(138,109,47,0.12)", border: "1px solid rgba(138,109,47,0.5)", borderRadius: 8, padding: "10px 12px", fontSize: 13, margin: "4px 0 10px" }}>
                  {/turf/i.test(raceInfo.surface || "") && (
                    <div style={{ marginBottom: 8, paddingBottom: 8, borderBottom: "1px solid rgba(138,109,47,0.35)" }}>
                      <button onClick={() => setOffTurf(!offTurf)}
                        style={{ background: offTurf ? GOLD : "transparent", color: offTurf ? "#3A2F17" : "#2E2A20", border: "1px solid rgba(138,109,47,0.6)", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {offTurf ? "\u2713 " : ""}Ran off the turf
                      </button>
                      <span style={{ fontSize: 11, color: "#4A4437", marginLeft: 8 }}>
                        {offTurf
                          ? "Logging as dirt (off turf) \u2014 the card said turf, so these ratings were built on turf form."
                          : "Card says turf. Tap if the stewards moved it to the main track."}
                      </span>
                    </div>
                  )}
                  {finishPicks.length === 0 && "Race is official? Tap the WINNER above."}
                  {finishPicks.length === 1 && "Now tap SECOND place."}
                  {finishPicks.length === 2 && "Now tap THIRD place."}
                  {finishPicks.length >= 3 && (
                    <span>Top three set — tote payouts on each line (optional), then Save Results below.</span>
                  )}
                </div>
              )}
              {betSlipOpen && (
                <div style={{ background: "#F2E8D0", color: "#3A3226", borderRadius: 4, padding: "14px 16px", margin: "4px 0 12px", fontFamily: "'Courier New', monospace", border: "1px solid #C9B98F", borderTop: "3px dashed #C9B98F", borderBottom: "3px dashed #C9B98F", boxShadow: "0 3px 8px rgba(0,0,0,0.35)", maxWidth: 520, transform: raceDone ? "rotate(1.4deg) translateY(2px)" : "none", opacity: raceDone ? 0.85 : 1, clipPath: raceDone ? "polygon(0 0, 100% 0, 100% 93%, 95% 100%, 89% 94%, 83% 100%, 77% 94%, 71% 100%, 65% 94%, 59% 100%, 53% 94%, 47% 100%, 41% 94%, 35% 100%, 29% 94%, 23% 100%, 17% 94%, 11% 100%, 5% 94%, 0 100%)" : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, letterSpacing: "0.1em" }}>
                    <span>GOLDEN GATE STYLE PARI-MUTUEL</span>
                    <span style={{ color: "#A33327", fontWeight: 700 }}>{slipSerial}</span>
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: "0.14em", margin: "6px 0 10px" }}>
                    {(cardMeta.track || "").toUpperCase()} · RACE {raceInfo.raceNumber} · {ymdToDisplay(cardMeta.date)}
                  </div>
                  {(raceBets[num(raceInfo.raceNumber)] || []).length > 0 && (
                    <div style={{ borderBottom: "1px dashed #C9B98F", marginBottom: 10, paddingBottom: 8 }}>
                      {(raceBets[num(raceInfo.raceNumber)] || []).map((b, bi) => (
                        <div key={b.id || bi} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12, padding: "3px 0", opacity: b.settled ? 0.45 : 1 }}>
                          <span style={{ fontWeight: 700, flex: 1 }}>
                            {b.bet_type} ${Number(b.amount).toFixed(2)} — #{b.post} {String(b.horse).toUpperCase()}
                          </span>
                          {b.settled ? (
                            <span style={{ fontWeight: 700, letterSpacing: "0.08em", color: isRefund(b) ? "#6B6350" : b.won ? "#2E6B45" : "#A33327" }}>
                              {isRefund(b) ? "REFUNDED \u00b7 SCRATCHED" : (b.won ? `WON${b.payout ? ` $${Number(b.payout).toFixed(2)}` : ""}` : "LOST") + " \u00b7 SETTLED"}
                            </span>
                          ) : (
                            <button onClick={() => cancelBet(b)}
                              style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 10, letterSpacing: "0.1em", padding: "3px 8px", borderRadius: 3, cursor: "pointer", background: "transparent", color: "#A33327", border: "2px solid #A33327" }}>
                              CANCEL
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                  {raceDone ? (
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: "0.12em", color: "#A33327", border: "2px solid #A33327", borderRadius: 3, padding: "6px 10px", transform: "rotate(-2deg)", display: "inline-block", marginBottom: 10 }}>
                        RACE OFFICIAL — WINDOW CLOSED
                      </div>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <button onClick={() => setBetSlipOpen(false)} style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 12, padding: "6px 14px", borderRadius: 3, cursor: "pointer", background: "#3A3226", color: "#F2E8D0", border: "none" }}>Done</button>
                        <button onClick={() => { setBetSlipOpen(false); cancelResults(); }} disabled={busy}
                          style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 12, padding: "6px 14px", borderRadius: 3, cursor: "pointer", background: "transparent", color: "#A33327", border: "1px solid #A33327" }}>
                          Cancel results
                        </button>
                      </div>
                    </div>
                  ) : !slipStamped ? (
                    <div>
                      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                        {["WIN", "PLACE", "SHOW"].map((t) => (
                          <button key={t} onClick={() => setSlipType(t)}
                            style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 12, letterSpacing: "0.1em", padding: "5px 12px", borderRadius: 3, cursor: "pointer", background: slipType === t ? "#A33327" : "transparent", color: slipType === t ? "#F2E8D0" : "#3A3226", border: "2px solid #A33327" }}>
                            {t}
                          </button>
                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                        {overlay.filter((o) => !o.scratched).map((o) => (
                          <button key={o.i} onClick={() => setSlipHorseI(o.i)}
                            style={{ fontFamily: "inherit", fontSize: 12, padding: "4px 9px", borderRadius: 3, cursor: "pointer", background: slipHorseI === o.i ? "#3A3226" : "transparent", color: slipHorseI === o.i ? "#F2E8D0" : "#3A3226", border: "1px solid #3A3226" }}>
                            {o.post} · {o.name}
                          </button>
                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 10 }}>
                        {["2", "5", "10", "20"].map((a) => (
                          <button key={a} onClick={() => setSlipAmount(a)}
                            style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 12, padding: "4px 10px", borderRadius: 3, cursor: "pointer", background: slipAmount === a ? "#3A3226" : "transparent", color: slipAmount === a ? "#F2E8D0" : "#3A3226", border: "1px solid #3A3226" }}>
                            ${a}
                          </button>
                        ))}
                        <input value={slipAmount} onChange={(e) => setSlipAmount(e.target.value)} inputMode="decimal"
                          style={{ fontFamily: "inherit", fontSize: 12, width: 64, padding: "4px 8px", border: "1px solid #3A3226", borderRadius: 3, background: "transparent", color: "#3A3226" }} />
                      </div>
                      <div style={{ display: "flex", gap: 10 }}>
                        <button onClick={punchTicket} style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 13, letterSpacing: "0.12em", padding: "7px 16px", borderRadius: 3, cursor: "pointer", background: "#A33327", color: "#F2E8D0", border: "none" }}>PUNCH TICKET</button>
                        <button onClick={() => setBetSlipOpen(false)} style={{ fontFamily: "inherit", fontSize: 12, padding: "7px 12px", borderRadius: 3, cursor: "pointer", background: "transparent", color: "#3A3226", border: "1px solid #3A3226" }}>Back</button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 700, letterSpacing: "0.1em", color: "#A33327", border: "2px solid #A33327", borderRadius: 3, padding: "8px 10px", transform: "rotate(-1.2deg)", display: "inline-block", marginBottom: 10 }}>
                        {slipStamped}
                      </div>
                      <div style={{ display: "flex", gap: 10 }}>
                        <button onClick={() => { setSlipStamped(null); setSlipSerial("GGF-" + String(Date.now() % 100000).padStart(5, "0")); }}
                          style={{ fontFamily: "inherit", fontSize: 12, padding: "6px 12px", borderRadius: 3, cursor: "pointer", background: "transparent", color: "#3A3226", border: "1px solid #3A3226" }}>+ Another bet</button>
                        <button onClick={() => setBetSlipOpen(false)} style={{ fontFamily: "inherit", fontWeight: 700, fontSize: 12, padding: "6px 14px", borderRadius: 3, cursor: "pointer", background: "#3A3226", color: "#F2E8D0", border: "none" }}>Done</button>
                      </div>
                    </div>
                  )}
                </div>
              )}
              {logMsg && !raceDone && (
                <div style={{ background: "rgba(143,196,159,0.12)", border: "1px solid rgba(143,196,159,0.5)", borderRadius: 8, padding: "10px 12px", fontSize: 13, margin: "4px 0 10px" }}>
                  ✓ {logMsg}
                </div>
              )}
              <p style={{ fontSize: 11, color: "#6B6353", marginTop: 16, lineHeight: 1.55 }}>
                Rows are in post-position order, like the program. RTG = the legacy 1979-style rating. FAIR = the odds
                the machine would set. ODDS = the live board — the only thing you type. VALUE = WIN% × (ODDS+1) − 1.
                WIN / PLC / SHW = chance to finish 1st, top two, or top three. Tap a horse's name for details; use
                Scratch for late scratches.
              </p>
              <p style={{ fontSize: 11, color: "#6B6353", marginTop: 8, lineHeight: 1.55 }}>
                ★ = the machine's bet (shown only when the verdict is a bet). Numbered badges always show the machine's rating rank. Model % is an
                approximation from the ratings, not a calibrated probability, and the track keeps 15–20% of the pool —
                treat edges as signals to investigate, not sure things. In the words of the original manual: some
                unknowns just can't be predicted. This is a period-style analytical toy, not betting advice.
              </p>
            </div>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 14, ...labelFont, color: "#7A756A" }}>
          🏇 For thoroughbreds, 6 furlongs or more · no maiden races
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HorseRaceAnalyzer />);
</script>
</body>
</html>
