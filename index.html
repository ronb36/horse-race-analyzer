<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

// ============================================================
// HORSE RACE ANALYZER — a tribute to the 1979 Mattel original
// Two-stage card reader: scan races -> pick -> extract -> rate
// ============================================================

function num(v) {
  const n = typeof v === "string" ? parseFloat(v) : v;
  return Number.isFinite(n) ? n : null;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// Parse "8-1", "5/2", "2.5" -> decimal odds-to-1
function parseOdds(v) {
  if (v === null || v === undefined || v === "") return null;
  const str = String(v).trim();
  const m = str.match(/^(\d+(?:\.\d+)?)\s*[-\/]\s*(\d+(?:\.\d+)?)$/);
  if (m) return parseFloat(m[1]) / parseFloat(m[2]);
  const f = parseFloat(str);
  return Number.isFinite(f) ? f : null;
}

// Standard tote-board odds ladder; converts decimal odds-to-1 to board notation
const BOARD_LADDER = [
  [0.1, "1/10"], [0.2, "1/5"], [0.4, "2/5"], [0.5, "1/2"], [0.6, "3/5"], [0.8, "4/5"],
  [1, "1"], [1.2, "6/5"], [1.4, "7/5"], [1.5, "3/2"], [1.6, "8/5"], [1.8, "9/5"],
  [2, "2"], [2.5, "5/2"], [3, "3"], [3.5, "7/2"], [4, "4"], [4.5, "9/2"],
  [5, "5"], [6, "6"], [7, "7"], [8, "8"], [9, "9"], [10, "10"], [12, "12"],
  [15, "15"], [20, "20"], [25, "25"], [30, "30"], [40, "40"], [50, "50"], [99, "99"],
];
function normalizeOdds(v) {
  const str = String(v || "").trim();
  if (/^\d+\.\d+$/.test(str)) return decimalToBoard(parseFloat(str));
  return str;
}

function decimalToBoard(dec) {
  if (dec === null || dec === undefined || !Number.isFinite(dec)) return "";
  let best = BOARD_LADDER[0];
  for (const step of BOARD_LADDER) {
    if (Math.abs(step[0] - dec) / Math.max(dec, 0.1) < Math.abs(best[0] - dec) / Math.max(dec, 0.1)) best = step;
  }
  return best[1];
}

// ---------- Brisnet single-file data parser (deterministic — no AI involved) ----------
function parseCSVLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function looksLikeBrisnet(text) {
  const first = (text || "").split(/\r?\n/, 1)[0] || "";
  return first.split(",").length > 300;
}

function parseBrisnetFile(text) {
  const rows = text.split(/\r?\n/).filter((l) => l.trim().length).map(parseCSVLine);
  const f = (row, n) => (row[n - 1] ?? "").trim();
  const fn = (row, n) => { const x = parseFloat(f(row, n)); return Number.isFinite(x) ? x : null; };
  const byRace = new Map();
  for (const row of rows) {
    if (row.length < 850) continue;
    if (f(row, 5) === "S") continue; // scratched
    const raceNo = fn(row, 3);
    if (raceNo === null) continue;
    if (!byRace.has(raceNo)) byRace.set(raceNo, []);
    byRace.get(raceNo).push(row);
  }
  const first = rows.find((r) => r.length >= 850);
  const dateRaw = first ? f(first, 2) : "";
  const title = first
    ? `${f(first, 1)} ${dateRaw.length === 8 ? dateRaw.slice(4, 6) + "/" + dateRaw.slice(6, 8) + "/" + dateRaw.slice(0, 4) : dateRaw}`
    : "Brisnet card";
  const races = [...byRace.keys()].sort((a, b) => a - b).map((no) => {
    const rws = byRace.get(no);
    const r0 = rws[0];
    const yards = fn(r0, 6);
    const type = f(r0, 9).toUpperCase();
    const ageSex = f(r0, 10).toUpperCase();
    return {
      raceNumber: no,
      distanceFurlongs: yards !== null ? Math.round((Math.abs(yards) / 220) * 100) / 100 : null,
      surface: /T/i.test(f(r0, 7)) ? "turf" : "dirt",
      purse: fn(r0, 12),
      type: f(r0, 11) || type,
      isMaiden: type === "S" || type === "M" || type === "MO",
      is2yo: ageSex.slice(0, 2) === "AO",
      horseCount: rws.length,
    };
  });
  return { title, track: first ? f(first, 1) : "", dateStr: dateRaw, races, byRace };
}

function titleCase(str) {
  return String(str || "").toLowerCase()
    .replace(/(^|[\s'’-])\S/g, (c) => c.toUpperCase())
    .replace(/(['’])S(\s|$)/g, "$1s$2");
}

function brisnetHorses(rws) {
  const f = (row, n) => (row[n - 1] ?? "").trim();
  const fn = (row, n) => { const x = parseFloat(f(row, n)); return Number.isFinite(x) ? x : null; };
  const t = (v) => (v === null || v === undefined ? "" : String(v));
  return rws.map((row) => {
    const past = (slot) => {
      if (!f(row, 256 + slot)) return { finishPosition: "", lengthsBehindFirstCall: "", lengthsBehindSecondCall: "", lengthsBehindFinish: "", speedRating: "" };
      return {
        finishPosition: t(fn(row, 616 + slot)),
        lengthsBehindFirstCall: t(fn(row, 666 + slot)),
        lengthsBehindSecondCall: t(fn(row, 686 + slot)),
        lengthsBehindFinish: t(fn(row, 746 + slot)),
        speedRating: t(fn(row, 846 + slot)),
      };
    };
    let races = fn(row, 86), w = fn(row, 87), p = fn(row, 88), sh = fn(row, 89), earn = fn(row, 90);
    if (!races) { races = fn(row, 97); w = fn(row, 98); p = fn(row, 99); sh = fn(row, 100); earn = fn(row, 101); }
    const ml = fn(row, 44);
    const history = [];
    for (let k = 0; k < 10; k++) {
      const d = f(row, 256 + k);
      if (!d) break;
      const yards = fn(row, 316 + k);
      history.push({
        date: d,
        track: f(row, 286 + k),
        distF: yards !== null ? Math.round((Math.abs(yards) / 220) * 10) / 10 : null,
        surface: /T/i.test(f(row, 326 + k)) ? "T" : "D",
        fin: fn(row, 616 + k),
        lebFin: fn(row, 746 + k),
        spd: fn(row, 846 + k),
        odds: fn(row, 516 + k),
      });
    }
    return {
      name: titleCase(f(row, 45)) || "",
      postPosition: t(fn(row, 4)),
      daysSinceLastRace: t(fn(row, 224)),
      racesThisYear: t(races), wins: t(w), places: t(p), shows: t(sh), earnings: t(earn),
      mlOdds: ml !== null ? decimalToBoard(ml) : "",
      lastRace: past(0), priorRace: past(1),
      trainer: f(row, 28), jockey: f(row, 33),
      runStyle: f(row, 210), quirinPts: t(fn(row, 211)), primePower: t(fn(row, 251)),
      sire: f(row, 52), dam: f(row, 54), breeder: f(row, 56), bredIn: f(row, 57),
      history,
    };
  });
}

/* SIM-CORE BEGIN — rating engine. Changes here are [sim] builds: major version, explicit declaration, owner sign-off. */
function ratePastRaceEarlySpeed(race) {
  if (!race) return null;
  const leb1 = num(race.lengthsBehindFirstCall);
  if (leb1 === null) return null;
  return clamp(12 - leb1 * 1.5, 0, 12);
}

function rateHorse(horse, raceInfo, speedScale) {
  const c = {};
  const isSprint = (num(raceInfo.distanceFurlongs) ?? 8) < 8;

  // 1. EARLY SPEED — Quirin's strongest positive factor
  const es1 = ratePastRaceEarlySpeed(horse.lastRace);
  const es2 = ratePastRaceEarlySpeed(horse.priorRace);
  let early = 0, earlyCount = 0;
  if (es1 !== null) { early += es1; earlyCount++; }
  if (es2 !== null) { early += es2; earlyCount++; }
  if (earlyCount === 1) early *= 2;
  c.earlySpeed = clamp(early * (isSprint ? 1.25 : 1), 0, isSprint ? 30 : 24);

  // 2. RECENT FORM
  let form = 0;
  const lr = horse.lastRace || {};
  const fin = num(lr.finishPosition);
  if (fin !== null) {
    const finPts = { 1: 10, 2: 8, 3: 6, 4: 4, 5: 2 }[fin] ?? 0;
    form += isSprint ? finPts * 0.6 : finPts;
  }
  const lebFin = num(lr.lengthsBehindFinish);
  if (lebFin !== null) form += clamp(8 - lebFin, 0, 8);
  const leb2 = num(lr.lengthsBehindSecondCall);
  if (lebFin !== null && leb2 !== null && lebFin < leb2) form += 2;
  c.recentForm = clamp(form, 0, 20);

  // 3. SPEED RATINGS
  const sr1 = num(lr.speedRating);
  const sr2 = num((horse.priorRace || {}).speedRating);
  const figs = [sr1, sr2].filter((x) => x !== null);
  if (figs.length) {
    const avg = figs.reduce((a, b) => a + b, 0) / figs.length;
    c.speed = speedScale === "beyer"
      ? clamp(((avg - 40) / 60) * 24, 0, 24)
      : clamp(((avg - 60) / 40) * 24, 0, 24);
  } else c.speed = 0;

  // 4. CLASS
  const races = num(horse.racesThisYear);
  const earnings = num(horse.earnings);
  const purse = num(raceInfo.purse);
  if (races && earnings !== null && purse) {
    c.class = clamp((earnings / races / (0.6 * purse)) * 12, 0, 12);
  } else c.class = 0;

  // 5. CONSISTENCY
  const w = num(horse.wins), p = num(horse.places), s = num(horse.shows);
  if (races && w !== null) {
    c.consistency = clamp((w / races) * 8 + ((w + (p ?? 0) + (s ?? 0)) / races) * 4, 0, 12);
  } else c.consistency = 0;

  // 6. FRESHNESS
  const days = num(horse.daysSinceLastRace);
  if (days !== null) {
    if (days >= 7 && days <= 30) c.freshness = 8;
    else if (days >= 31 && days <= 45) c.freshness = 6;
    else if (days >= 4 && days <= 6) c.freshness = 5;
    else if (days >= 46 && days <= 60) c.freshness = 4;
    else if (days >= 61 && days <= 90) c.freshness = 2;
    else if (days < 4) c.freshness = 3;
    else c.freshness = 0;
  } else c.freshness = 0;

  // 7. POST POSITION
  const post = num(horse.postPosition);
  if (post !== null) {
    if (isSprint) c.post = post <= 4 ? 2 : post <= 8 ? 1 : 0;
    else c.post = post <= 7 ? 1 : post >= 10 ? -1 : 0;
  } else c.post = 0;

  const total = Object.values(c).reduce((a, b) => a + b, 0);
  return { components: c, rating: Math.round(total * 10) / 10 };
}

const COMPONENT_LABELS = {
  earlySpeed: "Early speed", recentForm: "Recent form", speed: "Speed figures",
  class: "Class", consistency: "Consistency", freshness: "Freshness", post: "Post position",
};

const emptyRace = () => ({
  finishPosition: "", lengthsBehindFirstCall: "", lengthsBehindSecondCall: "",
  lengthsBehindFinish: "", speedRating: "",
});
const emptyHorse = () => ({
  name: "", postPosition: "", daysSinceLastRace: "", racesThisYear: "",
  wins: "", places: "", shows: "", earnings: "", mlOdds: "",
  lastRace: emptyRace(), priorRace: emptyRace(),
});

const TRACK_ALIASES = {
  MTH: "MONMOUTH", SAR: "SARATOGA", BAQ: "AQUEDUCT", AQU: "AQUEDUCT", BEL: "BELMONT",
  GP: "GULFSTREAM", CD: "CHURCHILL", SA: "SANTA ANITA", DMR: "DEL MAR", KEE: "KEENELAND",
  WO: "WOODBINE", FG: "FAIR GROUNDS", OP: "OAKLAWN", RP: "REMINGTON", TAM: "TAMPA",
  PRX: "PARX", PIM: "PIMLICO", LRL: "LAUREL", CT: "CHARLES TOWN", ELP: "ELLIS",
  IND: "INDIANA", HOU: "HOUSTON", LS: "LONE STAR", EVD: "EVANGELINE", PID: "PRESQUE",
  CBY: "CANTERBURY", TUP: "TURF PARADISE", GG: "GOLDEN GATE", DEL: "DELAWARE",
  PEN: "PENN", MNR: "MOUNTAINEER", TDN: "THISTLEDOWN", FL: "FINGER LAKES",
  HAW: "HAWTHORNE", EMD: "EMERALD", LAD: "LOUISIANA DOWNS",
};

function trackMatches(code, name) {
  const C = String(code || "").toUpperCase().trim();
  const N = String(name || "").toUpperCase().trim();
  if (!C || !N) return false;
  if (C === N) return true;
  if (TRACK_ALIASES[C] && N.includes(TRACK_ALIASES[C])) return true;
  return N.startsWith(C);
}

function ymdToDisplay(ymd) {
  return ymd && ymd.length === 8 ? `${ymd.slice(4, 6)}/${ymd.slice(6, 8)}/${ymd.slice(0, 4)}` : ymd || "";
}

function entriesDateToYmd(dateStr) {
  const m = String(dateStr || "").match(/([A-Za-z]+)\s+(\d{1,2})\w*,\s*(\d{4})/);
  if (!m) return "";
  const months = ["january","february","march","april","may","june","july","august","september","october","november","december"];
  const mi = months.indexOf(m[1].toLowerCase());
  if (mi < 0) return "";
  return m[3] + String(mi + 1).padStart(2, "0") + String(m[2]).padStart(2, "0");
}

// ---------- Free entries-page (TwinSpires/Brisnet) scanner ----------
function parseEntriesText(flatText) {
  const flat = flatText.replace(/\s+/g, " ");
  const parts = flat.split(/(\d{1,2})(?:st|nd|rd|th)\s+Race\s*-\s*/);
  let track = "", dateStr = "";
  const idMatch = flat.match(/[?&]trackId=([A-Za-z0-9]{2,5})/);
  let trackCode = idMatch ? idMatch[1].toUpperCase() : null;
  const races = [];
  for (let i = 1; i < parts.length; i += 2) {
    const no = parseInt(parts[i], 10);
    const body = parts[i + 1] || "";
    const hm = body.match(/^([^-]+?)\s*-\s*([A-Za-z]+,\s*[A-Za-z]+\s+\d+\w*,\s*\d{4})/);
    if (hm) { track = hm[1].trim(); dateStr = hm[2]; }
    const tail = hm ? body.slice(hm[0].length) : body;
    const squish = (x) => String(x).toUpperCase().replace(/[^A-Z0-9]/g, "");
    const RACE_TYPES = ["MAIDEN SPECIAL WEIGHT", "MAIDEN OPTIONAL CLAIMING", "MAIDEN CLAIMING", "ALLOWANCE OPTIONAL CLAIMING", "STARTER OPTIONAL CLAIMING", "STARTER ALLOWANCE", "STARTER HANDICAP", "OPTIONAL CLAIMING", "ALLOWANCE", "CLAIMING", "STAKES", "HANDICAP", "MAIDEN"];
    const squHead = squish(tail.slice(0, 120));
    let rtype = "";
    for (const rt of RACE_TYPES) {
      if (squHead.startsWith(squish(rt))) { rtype = rt.replace(/\w\S*/g, (w) => w[0] + w.slice(1).toLowerCase()); break; }
    }
    if (!rtype) {
      const tm2 = tail.match(/^\s*([A-Z][A-Z \-\.,'&]+?)\.\s/);
      rtype = tm2 ? tm2[1].replace(/\s+/g, " ").replace(/\w\S*/g, (w) => w[0] + w.slice(1).toLowerCase()) : "";
    }
    const dm = tail.slice(0, 220).match(/(\d+)(?:\s+(\d+)\s*\/\s*(\d+))?\s*(Furlongs?|Miles?)/i);
    let distF = null;
    if (dm) {
      const v = parseFloat(dm[1]) + (dm[2] ? parseFloat(dm[2]) / parseFloat(dm[3]) : 0);
      distF = Math.round(v * (/^mile/i.test(dm[4]) ? 8 : 1) * 100) / 100;
    }
    const surface = /turf/i.test(tail.slice(0, 220)) ? "turf" : "dirt";
    const pm = tail.match(/Purse\s*\$([\d,]+)/);
    const purse = pm ? parseInt(pm[1].replace(/,/g, ""), 10) : null;
    const ptm = tail.match(/\((\d{1,2}:\d{2}\s*[AP]M)\)\s*\((\d+)\)/);
    const S400 = squish(tail.slice(0, 400));
    const isMaiden = squish(tail.slice(0, 80)).includes("MAIDEN");
    const is2yo = (S400.includes("TWOYEAROLD") || S400.includes("TWOYEARSOLD")) && !S400.includes("ANDUPWARD");
    const selM = tail.match(/S\s*e\s*l\s*e\s*c\s*t\s*i\s*o\s*n\s*s\s*:?\s*((?:\d+[\s,]*)+)/i);
    races.push({
      raceNumber: no, type: rtype, distanceFurlongs: distF, surface, purse,
      postTime: ptm ? ptm[1].replace(/^0/, "") : null, fieldSize: ptm ? parseInt(ptm[2], 10) : null,
      isMaiden, is2yo,
      selections: selM ? selM[1].replace(/\s+/g, "").replace(/,+$/, "") : null,
    });
  }
  // Program-style pages carry a Scratch Watch section: LIKELY scratches, not official ones
  const swIdx = flat.search(/S\s*c\s*r\s*a\s*t\s*c\s*h\s+W\s*a\s*t\s*c\s*h/i);
  if (swIdx >= 0) {
    const sect = flat.slice(swIdx, swIdx + 5000);
    const re = /(\d{1,2})\s+([A-Za-z][A-Za-z .'’-]{2,28}?)\s+\d{1,2}[A-Za-z]{3}\d{2}\s+[A-Z0-9]{2,5}\s*\d{0,2}\s+[A-Z0-9\/]+\s+([A-Za-z][A-Za-z-]+)/g;
    const seen = new Set();
    let m;
    while ((m = re.exec(sect))) {
      const rn = parseInt(m[1], 10);
      const nm = m[2].trim().replace(/\s*\(.*?\)\s*$/, "");
      const key = rn + "|" + nm.toUpperCase();
      if (seen.has(key)) continue;
      seen.add(key);
      const race = races.find((r) => r.raceNumber === rn);
      if (race) { (race.watch = race.watch || []).push({ horse: nm, reason: m[3] }); }
    }
  }
  if (!trackCode && track) {
    const TU = track.toUpperCase();
    for (const [code, sub] of Object.entries(TRACK_ALIASES)) {
      if (TU.includes(sub)) { trackCode = code; break; }
    }
  }
  return { track, trackCode, dateStr, races };
}

// ---------- Qualification rules (from the 1979 manual) ----------
function qualify(r) {
  const reasons = [];
  if (r.isMaiden) reasons.push("maiden race");
  if (r.is2yo) reasons.push("2-year-olds");
  if (num(r.distanceFurlongs) !== null && r.distanceFurlongs < 6) reasons.push("under 6 furlongs");
  return { ok: reasons.length === 0, reason: reasons.join(", ") };
}

// Deterministic bet verdict — the machine's call; the advisor only explains it.
// Policy: largest positive edge; < +10% => PASS; win% >= 15% => WIN;
// else PLACE if place% >= 35%; else SHOW if show% >= 50%; else PASS.
function simVerdict(rows) {
  const live = rows.filter((r) => !r.scratched && r.edge !== null && r.pModel !== null);
  if (!live.length) return { action: "NONE", horse: null };
  const best = live.reduce((a, b) => (b.edge > a.edge ? b : a));
  if (best.edge < 0.10) return { action: "PASS", horse: best };
  if (best.pModel >= 0.15) return { action: "WIN", horse: best };
  if ((best.pPlace ?? 0) >= 0.35) return { action: "PLACE", horse: best };
  if ((best.pShow ?? 0) >= 0.50) return { action: "SHOW", horse: best };
  return { action: "PASS", horse: best };
}
/* SIM-CORE END */

function Field({ label, value, onChange }) {

    <label style={{ display: "flex", flexDirection: "column", gap: 3 }}>
      <span style={{ ...labelFont, color: "#D8CBA8" }}>{label}</span>
      <input value={value ?? ""} onChange={(e) => onChange(e.target.value)} inputMode="decimal"
        style={{ background: LCD_BG, ...lcdFont, fontSize: 15, border: "1px solid rgba(0,0,0,0.4)",

    </label>

}

  async function filesToBlocks(fileList) {
    const files = Array.from(fileList || []);
    const supported = ["image/jpeg", "image/png", "image/webp", "image/gif", "application/pdf"];
    const bad = files.filter((f) => !supported.includes(f.type));
    if (bad.length) throw new Error(
      "Unsupported file type: " + bad.map((f) => f.name).join(", ") +
      ". Use JPG, PNG, WebP, or PDF. iPhone tip: HEIC photos won't work — screenshot the photo instead."
    );
    const blocks = [];
    for (const f of files) {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(",")[1]);
        r.onerror = () => rej(new Error("Could not read " + f.name));
        r.readAsDataURL(f);
      });
      blocks.push(f.type === "application/pdf"
        ? { type: "document", source: { type: "base64", media_type: "application/pdf", data: b64 } }
        : { type: "image", source: { type: "base64", media_type: f.type, data: b64 } });
    }
    return blocks;
  }

  async function askClaude(promptText) {
    if (!apiKey) throw new Error("Enter your Anthropic API key first (tap ⚙ Set on the home screen) — only needed for PDF/photo reading. Brisnet data files need no key.");
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 8000,
        temperature: 0,
        messages: [{ role: "user", content: [...fileBlocksRef.current, { type: "text", text: promptText }] }],
      }),
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = (await resp.text()).slice(0, 200); } catch {}
      throw new Error(`API request failed (HTTP ${resp.status}). ${detail}`);
    }
    const data = await resp.json();
    const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
    let clean = text.replace(/```json|```/g, "").trim();
    const braceAt = clean.indexOf("{");
    if (braceAt > 0) clean = clean.slice(braceAt);
    try {
      return JSON.parse(clean);
    } catch {}
    // Salvage a response that was cut off mid-stream: keep every complete entry
    const cut = clean.lastIndexOf("]]");
    if (cut > 0) {
      try {
        return JSON.parse(clean.slice(0, cut + 2) + "]}");
      } catch {}
    }
    throw new Error("Couldn't parse the reading. Raw response started: " + JSON.stringify(clean.slice(0, 160)));
  }

  async function saveCard(meta, title, index, dataMap) {

  }

  function applyCardFlags(next) {
    const clean = { cancelled: !!next.cancelled, cancelledRaces: (next.cancelledRaces || []).map(Number).filter((n) => Number.isFinite(n)) };

  // Cancellation lives inside the existing hra_cards.card jsonb (no schema change).
  // "Cancelled" means these races did not run — distinct from a race passed on,
  // which still owes a logged result for calibration.
  async function writeCardStatus(cardId, mutate) {
    const base = supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_cards?id=eq." + cardId;
    const g = await fetch(base + "&select=card,track,race_date", { headers: supaHeaders() });
    if (!g.ok) throw new Error("HTTP " + g.status);
    const row = (await g.json())[0] || {};
    const card = row.card || {};
    const next = mutate({ cancelled: !!card.cancelled, cancelledRaces: (card.cancelledRaces || []).map(Number) });
    const p = await fetch(base, {
      method: "PATCH",
      headers: { ...supaHeaders(), Prefer: "return=minimal" },
      body: JSON.stringify({ card: { ...card, cancelled: next.cancelled, cancelledRaces: next.cancelledRaces }, updated_at: new Date().toISOString() }),
    });
    if (!p.ok) throw new Error("HTTP " + p.status + ": " + (await p.text()).slice(0, 120));
    if ((cardMeta.track || "") === row.track && (cardMeta.date || "") === row.race_date) applyCardFlags(next);
    return next;
  }

  function loadBrisnet(text, label) {

    const list = parsedB.races.map((race) => ({ ...race, ...qualify(race) }));
    setRaceIndex(list);
    const dataMap = {};
    for (const r of list) {
      if (!r.ok) continue;
      dataMap[r.raceNumber] = {

          purse: r.purse !== null && r.purse !== undefined ? String(r.purse) : "",

      };
    }
    setRaceData(dataMap);

    applyCardFlags({ cancelled: false, cancelledRaces: [] }); // a fresh upload is a re-prep

    const savedP = saveCard(meta, title, list, dataMap);
    // Uploads are setup, not racing (doctrine since 2.7.1): land on Cards on File
    // with this card's strip previewed up top. Racing starts from Race Day.
    setActiveRace(null);
    setExpanded(null); setWinnerMode(false); setScratchMode(false); setLogMsg(""); askSeqRef.current++; setClaudeRec(null); setClaudeErr(null); setClaudeThinking(false); setOffTurf(false);
    // Refresh the list only after the upsert settles — fetching immediately raced the save,
    // and the fresh card was missing from the rows (found 2026-08-07, SAR 08/07 invisible after upload).
    if (supaUrl && supaKey) { savedP.then(() => fetchSavedCards()).then((rows) => { const d0 = nearestUpcoming((rows || []).map((r) => r.race_date)); setCardsDate(d0); bindStripToDate(d0, rows, "CARDS ON FILE"); }); }
    setStep("cards");

  // ----- STAGE 1: scan the card, list every race -----
  async function handleFiles(fileList) {
    setError("");
    setBusy(true);
    setLcdMsg("SCANNING CARD...");
    try {
      const filesArr = Array.from(fileList || []);
      // Multiple Brisnet files/ZIPs at once — load and save each; the last stays on screen
      if (filesArr.length > 1) {
        const cardTexts = [];
        for (const f of filesArr) {
          if (/\.zip$/i.test(f.name) || /zip/.test(f.type || "")) {
            if (typeof fflate === "undefined") throw new Error("ZIP support didn't load. Unzip the files and upload the data files inside instead.");
            const buf = new Uint8Array(await f.arrayBuffer());
            const entries = fflate.unzipSync(buf);
            const names = Object.keys(entries).filter((n) => !n.endsWith("/"));
            let text = null, used = null;
            for (const n of names) {
              if (/\.(drf|dr[0-9]|mcp|csv|txt)$/i.test(n)) { text = new TextDecoder("latin1").decode(entries[n]); used = n; break; }
            }
            if (text === null) {
              for (const n of names) {
                const t2 = new TextDecoder("latin1").decode(entries[n]);
                if (looksLikeBrisnet(t2)) { text = t2; used = n; break; }
              }
            }
            if (text === null || !looksLikeBrisnet(text)) throw new Error("No Brisnet data file found inside " + f.name + ". It contains: " + names.join(", "));
            cardTexts.push({ text, label: used });
          } else if (!/^(image\/|application\/pdf)/.test(f.type || "")) {
            const t = await f.text();
            if (looksLikeBrisnet(t)) { cardTexts.push({ text: t, label: f.name }); } else { cardTexts.length = 0; break; }
          } else { cardTexts.length = 0; break; }
        }
        if (cardTexts.length === filesArr.length && cardTexts.length) {
          for (const c of cardTexts) loadBrisnet(c.text, c.label);
          setLcdMsg(cardTexts.length + " CARDS LOADED · ALL SAVED");
          return;
        }
      }
      // Brisnet ZIP straight from the download — unzip in the browser
      if (filesArr.length === 1 && (/\.zip$/i.test(filesArr[0].name) || /zip/.test(filesArr[0].type || ""))) {
        if (typeof fflate === "undefined") throw new Error("ZIP support didn't load. Unzip the file and upload the data file inside it instead.");
        const buf = new Uint8Array(await filesArr[0].arrayBuffer());
        const entries = fflate.unzipSync(buf);
        const names = Object.keys(entries).filter((n) => !n.endsWith("/"));
        let text = null, used = null;
        for (const n of names) {
          if (/\.(drf|dr[0-9]|mcp|csv|txt)$/i.test(n)) { text = new TextDecoder("latin1").decode(entries[n]); used = n; break; }
        }
        if (text === null) {
          for (const n of names) {
            const t2 = new TextDecoder("latin1").decode(entries[n]);
            if (looksLikeBrisnet(t2)) { text = t2; used = n; break; }
          }
        }
        if (text === null || !looksLikeBrisnet(text)) {
          throw new Error("No Brisnet data file found inside " + filesArr[0].name + ". It contains: " + names.join(", "));
        }
        loadBrisnet(text, used);
        return;
      }
      // Bare Brisnet data file (any name — validated by column count, not extension)
      if (filesArr.length === 1 && !/^(image\/|application\/pdf)/.test(filesArr[0].type || "")) {
        const rawText = await filesArr[0].text();
        if (looksLikeBrisnet(rawText)) {
          loadBrisnet(rawText, filesArr[0].name);
          return;
        }
        if (looksLikeEtd(rawText)) {
          setError("That's a Brisnet entries file (.etd) \u2014 scanning it as entries instead.");
          await handleScanFiles(fileList);
          return;
        }
        if (/\.(drf|dr[0-9]|mcp|csv|txt)$/i.test(filesArr[0].name)) {
          throw new Error("That file doesn't look like a Brisnet single-file card (too few columns). Buy the \"Single Data File\" product on brisnet.com and upload its ZIP or the data file inside.");
        }
      }
      // Entries pages mistakenly given to Upload card? Detect and scan them instead.
      if (filesArr.length && filesArr.every((f) => f.type === "application/pdf" || /pdf$/i.test(f.name))) {
        try {
          if (typeof pdfjsLib !== "undefined") {
            const probe = await pdfFileToText(filesArr[0]);
            if (parseEntriesText(scrubEntriesFooters(probe)).races.length) {
              await handleScanFiles(fileList);
              setScanNote("Those were free entries pages, not data cards — scanned them instead. Data cards go through 📄 Upload card.");
              return;
            }
          }
        } catch (probeErr) { console.error("entries probe", probeErr); }
      }
      brisRef.current = null;
      fileBlocksRef.current = await filesToBlocks(fileList);
      const parsed = await askClaude(
        `List every race on this past-performance card. Respond with ONLY valid compact JSON, no markdown fences, no commentary:
{"title":"Track MM/DD/YYYY","races":[[raceNumber,distanceFurlongs,"dirt"|"turf",purse,"short race type",isMaiden(0 or 1),is2yoOnly(0 or 1),horseCount],...]}
Notes: distanceFurlongs as a number (1 mile = 8, 1 1/16 mi = 8.5, 5 1/2f = 5.5). isMaiden=1 for any maiden race. is2yoOnly=1 if restricted to two-year-olds. Be terse; JSON only.`
      );
      setCardTitle(parsed.title || "");
      const m = /^(.*?)\s+(\d{2})\/(\d{2})\/(\d{4})/.exec(parsed.title || "");
      setCardMeta({ track: m ? m[1] : (parsed.title || ""), date: m ? m[4] + m[2] + m[3] : "" });
      setRaceData({}); setActiveRace(null);
      const pdfList = (parsed.races || []).map((r) => {
        const race = {
          raceNumber: r[0], distanceFurlongs: r[1], surface: r[2] || "dirt",
          purse: r[3], type: r[4] || "", isMaiden: !!r[5], is2yo: !!r[6], horseCount: r[7],
        };
        return { ...race, ...qualify(race) };
      });
      setRaceIndex(pdfList);
      const pdfFirst = pdfList.find((rr) => rr.ok);
      if (pdfFirst) { await pickRace(pdfFirst); }
      else { setStep("races"); setLcdMsg("SELECT RACE"); }
    } catch (e) {
      console.error(e);
      setError(e.message || String(e));
      setLcdMsg("READY");
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = "";
    }
  }

  // ----- STAGE 2: extract one chosen race -----
  async function pickRace(r) {
    if (!r.ok || busy) return;
    setError("");
    if (brisRef.current && brisRef.current.has(r.raceNumber)) { openBrisRace(r); return; }
    setBusy(true);
    setLcdMsg(`READING RACE ${r.raceNumber}...`);
    try {
      const parsed = await askClaude(
        `Extract ONLY race number ${r.raceNumber} from this card. Respond with ONLY valid compact JSON, no markdown fences, no spaces, no commentary:
{"horses":[["name",postPosition,daysSinceLastRace,racesThisYear,wins,places,shows,earnings,"morningLineOdds",[lastFinishPos,lenBehind1stCall,lenBehind2ndCall,lenBehindFinish,speedRating],[priorFinishPos,lenBehind1stCall,lenBehind2ndCall,lenBehindFinish,speedRating]],...]}
Rules: lenBehind = lengths behind the leader at that call (0 if leading), read from the running-line superscripts. speedRating = Beyer figure. races/wins/places/shows/earnings from the current-year record line (lifetime if that is all shown). daysSinceLastRace = most recent race date to today. morningLineOdds exactly as printed, e.g. "5-2" or "8-1", in position 9 of each horse array. The two trailing arrays are the two most recent races; use [null,null,null,null,null] if a horse has fewer than 2 starts. Every horse array has exactly 11 elements. JSON only, no trailing text.`
      );
      const toStr = (v) => (v === null || v === undefined ? "" : String(v));
      const mapRace = (arr) => ({
        finishPosition: toStr(arr?.[0]), lengthsBehindFirstCall: toStr(arr?.[1]),
        lengthsBehindSecondCall: toStr(arr?.[2]), lengthsBehindFinish: toStr(arr?.[3]),
        speedRating: toStr(arr?.[4]),
      });
      const infoObj = {
        raceNumber: toStr(r.raceNumber), distanceFurlongs: toStr(r.distanceFurlongs),
        purse: toStr(r.purse), surface: r.surface,
      };
      const horsesArr = ((parsed.horses || []).map((h) => ({
        name: toStr(h?.[0]), postPosition: toStr(h?.[1]), daysSinceLastRace: toStr(h?.[2]),
        racesThisYear: toStr(h?.[3]), wins: toStr(h?.[4]), places: toStr(h?.[5]),
        shows: toStr(h?.[6]), earnings: toStr(h?.[7]),
        mlOdds: toStr(h?.[8]),
        lastRace: mapRace(h?.[9]), priorRace: mapRace(h?.[10]),
      })));
      setRaceInfo(infoObj);
      setHorses(horsesArr);
      setActiveRace(r.raceNumber);
      setRaceData((prev) => ({ ...prev, [r.raceNumber]: { raceInfo: infoObj, horses: horsesArr } }));
      setStep("review");
      setLcdMsg("CHECK ENTRIES");
    } catch (e) {
      console.error(e);
      setError(e.message || String(e));
    } finally {
      setBusy(false);
    }
  }

  async function loadEntriesForDate(ymd) {
    if (!supaUrl || !supaKey || !ymd) return;
    try {
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_entries?race_date=eq." + ymd + "&select=track,entries", {
        headers: supaHeaders(),
      });
      if (!resp.ok) return;
      const rows = await resp.json();
      if (!rows.length) return;
      setPostTimes((prev) => {
        const next = { ...prev };
        for (const row of rows) {
          next[String(row.track).toUpperCase() + "|" + ymd] = Object.fromEntries((row.entries || []).map((r) => [r.raceNumber, { t: r.postTime, sel: r.selections || null, watch: r.watch || [] }]));
        }
        return next;
      });
    } catch (e) {

    }
  }

  function postTimeToMinutes(t) {
    const m = String(t || "").match(/(\d{1,2}):(\d{2})\s*([AP]M)/i);
    if (!m) return 9999;
    let hh = parseInt(m[1], 10) % 12;
    if (/P/i.test(m[3])) hh += 12;
    return hh * 60 + parseInt(m[2], 10);
  }

  function extrasFor(code, ymd, raceNo, ptMap) {
    const C = String(code || "").toUpperCase();
    const D = String(ymd || "");
    const exact = ptMap[C + "|" + D];
    if (exact && exact[raceNo] !== undefined) {
      const v = exact[raceNo];
      return typeof v === "string" ? { t: v } : (v || { t: null });
    }
    for (const [key, times] of Object.entries(ptMap)) {
      const bar = key.indexOf("|");
      const name = bar < 0 ? key : key.slice(0, bar);
      const kd = bar < 0 ? "" : key.slice(bar + 1);
      if (kd && D && kd !== D) continue; // never borrow another date's post times
      if (trackMatches(C, name) && times[raceNo] !== undefined) {
        const v = times[raceNo];
        return typeof v === "string" ? { t: v } : (v || { t: null });
      }
    }
    return { t: null };
  }

  async function buildRaceCard(rows, day) {
    let ptMap = { ...postTimes };
    try {
      const er = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_entries?race_date=eq." + day + "&select=track,entries", { headers: supaHeaders() });
      if (er.ok) {
        for (const row of await er.json()) {
          ptMap[String(row.track).toUpperCase() + "|" + day] = Object.fromEntries((row.entries || []).map((r) => [r.raceNumber, { t: r.postTime, sel: r.selections || null, watch: r.watch || [] }]));
        }
        setPostTimes(ptMap);
      }
    } catch (entriesErr) { console.error(entriesErr); }
    const betMap = {}, runMap = {};
    try {
      const br = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_bets?race_date=eq." + day + "&select=track,race_no,settled,won,payout,amount", { headers: supaHeaders() });
      if (br.ok) for (const b of await br.json()) { const k = b.track + "|" + b.race_no; (betMap[k] = betMap[k] || []).push(b); }
    } catch (e2) { console.error(e2); }
    try {
      const lr = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_race_log?race_date=eq." + day + "&is_winner=eq.true&select=track,race_no", { headers: supaHeaders() });
      if (lr.ok) for (const w of await lr.json()) runMap[w.track + "|" + w.race_no] = true;
    } catch (e3) { console.error(e3); }
    const items = [];
    for (const row of rows.filter((r) => r.race_date === day)) {
      const cardOff = !!(row.card && row.card.cancelled);
      const racesOff = new Set((((row.card && row.card.cancelledRaces) || [])).map(Number));
      for (const r of (row.card && row.card.raceIndex) || []) {
        if (!r.ok) continue;
        const ex = extrasFor(row.track, day, r.raceNumber, ptMap);
        const k = row.track + "|" + r.raceNumber;
        const cachedHorses = row.card && row.card.raceData && row.card.raceData[r.raceNumber] && row.card.raceData[r.raceNumber].horses;
        const live = cachedHorses ? cachedHorses.filter((h) => !h.scratched).length : r.horseCount;
        items.push({
          cardId: row.id, track: row.track, raceNumber: r.raceNumber,
          distanceFurlongs: r.distanceFurlongs, surface: r.surface, type: r.type,
          horseCount: live, scrCount: cachedHorses ? cachedHorses.length - live : 0,
          postTime: ex.t, sortKey: postTimeToMinutes(ex.t),
          bets: betMap[k] || [], run: !!runMap[k],
          cancelled: cardOff || racesOff.has(Number(r.raceNumber)), cardOff,
        });
      }
    }
    items.sort((a, b) => a.sortKey - b.sortKey || String(a.track).localeCompare(String(b.track)) || a.raceNumber - b.raceNumber);
    const dates = [...new Set(rows.map((r) => r.race_date))];
    setDayView({ ymd: day, date: ymdToDisplay(day), dates, items });
    bindStripToDate(day, rows, "RACE DAY"); // the strip must never show a different day than the list
  }

  function todayYmd() {
    const d = new Date();
    return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  }

  function nearestUpcoming(ymds) {
    const today = todayYmd();
    const up = [...new Set(ymds)].filter((d) => d && d >= today).sort();
    return up.length ? up[0] : null;
  }

  async function fetchUploadCounts() {
    if (!supaUrl || !supaKey) return;
    const ymd = todayYmd();
    try {
      const [er, cr] = await Promise.all([
        fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_entries?race_date=gte." + ymd + "&select=race_date", { headers: supaHeaders() }),
        fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_cards?race_date=gte." + ymd + "&select=race_date", { headers: supaHeaders() }),
      ]);
      const summarize = (rows) => {
        const dates = rows.map((r) => r.race_date).filter(Boolean).sort();
        if (!dates.length) return { label: "none ahead" };
        const next = dates[0];
        const nextCount = dates.filter((d) => d === next).length;
        const laterDates = new Set(dates.filter((d) => d !== next)).size;
        const md = next.length === 8 ? `${parseInt(next.slice(4, 6), 10)}/${parseInt(next.slice(6, 8), 10)}` : next;
        return { label: `${md} (${nextCount})${laterDates ? ` +${laterDates}` : ""}` };
      };
      setUploadCounts({
        entries: er.ok ? summarize(await er.json()) : null,
        cards: cr.ok ? summarize(await cr.json()) : null,
      });
    } catch (e) { console.error("upload counts", e); }
  }

  async function loadAudit() {
    if (!supaUrl || !supaKey) { setError("The Audit needs Supabase (tap ⚙ Set)."); return; }
    setError(""); setBusy(true); setLcdMsg("RUNNING THE AUDIT...");
    try {
      const base = supaUrl.replace(/\/+$/, "") + "/rest/v1/";
      const [cardsR, logR, betsR, entR] = await Promise.all([
        fetch(base + "hra_cards?select=track,race_date,idx:card->raceIndex,cx:card->cancelled,cxr:card->cancelledRaces&order=race_date.desc&limit=60", { headers: supaHeaders() }),
        fetch(base + "hra_race_log?select=track,race_date,race_no,horse,is_winner,pay_win,rating,model_pct,odds&limit=4000", { headers: supaHeaders() }),
        fetch(base + "hra_bets?select=track,race_date,race_no,settled,won,payout,amount&limit=1000", { headers: supaHeaders() }),
        fetch(base + "hra_entries?select=track,race_date&limit=200", { headers: supaHeaders() }),
      ]);
      if (!cardsR.ok) throw new Error("cards HTTP " + cardsR.status);
      const cards = await cardsR.json();
      const logs = logR.ok ? await logR.json() : [];
      const bets = betsR.ok ? await betsR.json() : [];
      const ents = entR.ok ? await entR.json() : [];
      const dates = [...new Set([...cards.map((c) => c.race_date), ...logs.map((l) => l.race_date), ...bets.map((b) => b.race_date)])]
        .filter(Boolean).sort().reverse();
      const view = dates.map((d) => {
        const dayCardsA = cards.filter((c) => c.race_date === d);
        const cardKeys = new Set(dayCardsA.map((c) => c.track));
        const tracks = dayCardsA.map((c) => {
          const cardOff = !!c.cx;
          const racesOff = new Set(((c.cxr) || []).map(Number));
          const eligAll = (c.idx || []).filter((r) => r.ok).map((r) => num(r.raceNumber)).filter((n) => n !== null);
          // races that did not run owe nothing: excluded from the reconciliation
          const notRun = cardOff ? eligAll : eligAll.filter((n) => racesOff.has(n));
          const elig = cardOff ? [] : eligAll.filter((n) => !racesOff.has(n));
          const tLogs = logs.filter((l) => l.race_date === d && l.track === c.track);
          const loggedNos = new Set(tLogs.map((l) => num(l.race_no)));
          const unlogged = elig.filter((n) => !loggedNos.has(n));
          const missingPay = [...new Set(tLogs.filter((l) => l.is_winner && l.pay_win === null).map((l) => num(l.race_no)))].sort((a, b) => a - b);
          const tBets = bets.filter((b) => b.race_date === d && b.track === c.track);
          const unsettled = tBets.filter((b) => !b.settled).length;
          const stray = [...new Set(tBets.filter((b) => !elig.includes(num(b.race_no))).map((b) => num(b.race_no)))];
          const settled = tBets.filter((b) => b.settled);
          const staked = settled.reduce((s, b) => s + (num(b.amount) || 0), 0);
          const returned = settled.reduce((s, b) => s + (num(b.payout) || 0), 0);
          const noRating = tLogs.filter((l) => l.rating === null || l.model_pct === null).length;
          const noOdds = tLogs.filter((l) => l.odds === null || l.odds === "").length;
          // 2.15.3: duplicate horse-rows per race. Invisible to the eligible-vs-logged count
          // (thirty rows read as "logged" exactly like ten), but they double a race's weight
          // in any refit. Caused by a delete that silently removed nothing before re-logging.
          const seen = {};
          tLogs.forEach((l) => { const k = num(l.race_no) + "|" + (l.horse || ""); seen[k] = (seen[k] || 0) + 1; });
          const dupRaces = [...new Set(Object.keys(seen).filter((k) => seen[k] > 1).map((k) => Number(k.split("|")[0])))].sort((a, b) => a - b);
          const dupRows = Object.keys(seen).reduce((s, k) => s + (seen[k] > 1 ? seen[k] - 1 : 0), 0);
          const clean = unlogged.length === 0 && missingPay.length === 0 && unsettled === 0 && stray.length === 0 && noRating === 0 && noOdds === 0 && dupRaces.length === 0;
          return { track: c.track, elig: elig.length, logged: elig.filter((n) => loggedNos.has(n)).length, rows: tLogs.length,
            unlogged, missingPay, tickets: tBets.length, unsettled, stray, staked, returned, noRating, noOdds, dupRaces, dupRows, clean,
            cardOff, notRun };
        });
        const orphans = bets.filter((b) => b.race_date === d && !cardKeys.has(b.track));
        const entCount = ents.filter((e) => e.race_date === d).length;
        const allOff = tracks.length > 0 && tracks.every((t) => t.cardOff);
        return { date: d, tracks, orphans: orphans.length, entCount, allOff,
          clean: tracks.every((t) => t.clean) && orphans.length === 0 && tracks.length > 0 };
      });
      setAuditView(view);
      setStep("audit");
      setLcdMsg("THE AUDIT");
    } catch (e) {
      setError("Couldn't run the audit. " + (e.message || e));
      setLcdMsg("READY");
    } finally { setBusy(false); }
  }



  function looksLikeEtd(text) {
    return /^\s*"[A-Z0-9]{2,5}","\d{8}"\s*,/.test(String(text)) && !looksLikeBrisnet(text);
  }

  function titleCaseWords(s) {
    return String(s).toLowerCase().replace(/\w\S*/g, (w) => w[0].toUpperCase() + w.slice(1));
  }

  function parseEtdEntries(text) {
    // Brisnet entries data file (.etd): one row per entrant, ~99 fields, scratches
    // already excluded. Fields (0-based): 0 track, 1 ymd, 2 race, 3 distance yards,
    // 5 surface T/D, 6 purse, 7 type flag (S/M/MO maiden, per k-file vocabulary),
    // 30 conditions text (semicolons for commas), 50 handicapper's selections.
    const rows = String(text).split(/\r?\n/).filter((l) => l.trim().length).map(parseCSVLine);
    const byRace = new Map();
    for (const r of rows) {
      if (r.length < 60) continue;
      const no = parseInt(r[2], 10);
      if (!Number.isFinite(no)) continue;
      if (!byRace.has(no)) byRace.set(no, []);
      byRace.get(no).push(r);
    }
    if (!byRace.size) return { track: "", trackCode: null, ymd: "", races: [] };
    const first = byRace.values().next().value[0];
    const trackCode = String(first[0] || "").toUpperCase().trim() || null;
    const ymd = String(first[1] || "").trim();
    const track = TRACK_ALIASES[trackCode] ? titleCaseWords(TRACK_ALIASES[trackCode]) : trackCode || "";
    const squishE = (x) => String(x).toUpperCase().replace(/[^A-Z0-9]/g, "");
    const races = [...byRace.entries()].sort((a, b) => a[0] - b[0]).map(([no, rs]) => {
      const r = rs[0];
      const cond = String(r[30] || "").replace(/;/g, ",");
      const flag = String(r[7] || "").toUpperCase().trim();
      const typeName = titleCaseWords((cond.split(".")[0] || "").trim()) || flag;
      const S = squishE(cond.slice(0, 400));
      const yards = parseFloat(r[3]);
      return {
        raceNumber: no,
        type: typeName,
        distanceFurlongs: Number.isFinite(yards) ? Math.round((yards / 220) * 100) / 100 : null,
        surface: String(r[5]).toUpperCase() === "T" ? "turf" : "dirt",
        purse: Number.isFinite(parseFloat(r[6])) ? parseFloat(r[6]) : null,
        postTime: null,
        fieldSize: rs.length,
        isMaiden: /^(S|M|MO)$/.test(flag) || /^MAIDEN/i.test(cond.trim()),
        is2yo: (S.includes("TWOYEAROLD") || S.includes("TWOYEARSOLD")) && !S.includes("ANDUPWARD"),
        selections: String(r[50] || "").trim() || null,
      };
    });
    return { track, trackCode, ymd, races };
  }

  async function mergeStoredPostTimes(key, ymd, races) {
    // .etd carries no post times; if a PDF scan for the same track+date is on file,
    // carry its post times (and scratch-watch) onto the fresh races.
    if (!supaUrl || !supaKey || !races.some((r) => !r.postTime)) return races;
    try {
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_entries?track=eq." + encodeURIComponent(key) + "&race_date=eq." + encodeURIComponent(ymd) + "&select=entries", { headers: supaHeaders() });
      if (!resp.ok) return races;
      const stored = ((await resp.json())[0] || {}).entries || [];
      const byNo = Object.fromEntries(stored.map((s) => [s.raceNumber, s]));
      return races.map((r) => {
        const s = byNo[r.raceNumber];
        return s ? { ...r, postTime: r.postTime || s.postTime || null, watch: (r.watch && r.watch.length ? r.watch : s.watch) || r.watch } : r;
      });
    } catch (e) { console.error("post-time merge", e); return races; }
  }

  function scrubEntriesFooters(text) {
    // TwinSpires printed-page footers (URL · timestamp · Page N of M) can land inside a
    // race block when a page break separates the race header from its type line —
    // the parser then sees footer junk where MAIDEN CLAIMING should be (DMR R8 07/30).
    // Keep the trackId token: canonical track codes ride in that same URL.
    const tid = String(text).match(/[?&]trackId=([A-Za-z0-9]{2,5})/);
    const cleaned = String(text)
      // whole-footer span: URL through "Page N of M", tolerant of pdf.js splitting the
      // URL and timestamp across lines ("...?use / r / USA&trackType..." / "19 / 07")
      .replace(/https?:\/\/[\s\S]{0,500}?Page\s+\d+\s+of\s+\d+/gi, " ")
      // fallbacks for footer pieces appearing alone
      .replace(/https?:\/\/\S+/g, " ")
      .replace(/\bPage\s+\d+\s+of\s+\d+/gi, " ")
      .replace(/\b\d{1,2}\/\d{1,2}\/\d{2,4},?\s*\d{1,2}\s*:?\s*\d{2}\b/g, " ")
      .replace(/\S*&[A-Za-z]+=\S*/g, " ");
    // one clean token at the end keeps the canonical code readable without polluting any race block
    return tid ? cleaned + " ?trackId=" + tid[1] + " " : cleaned;
  }

  async function fetchOwnedCards() {
    if (!supaUrl || !supaKey) return;
    try {
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_cards?select=id,track,race_date", { headers: supaHeaders() });
      if (resp.ok) { const rows = await resp.json(); setOwnedCards(rows); return rows; }
      return [];
    } catch (e) { console.error("owned cards fetch", e); return []; }
  }

  function clearStrip() {
    setRaceIndex([]); setRaceData({}); setHorses([]); setActiveRace(null);
    setCardTitle(""); setCardMeta({ track: "", date: "" });
  }

  function bindStripToDate(d, rows, label) {
    if (!d) { clearStrip(); return; }
    const match = (rows || []).filter((r) => r.race_date === d).sort((x, y) => String(x.track).localeCompare(String(y.track)))[0];

  async function pdfFileToText(file) {
    if (typeof pdfjsLib === "undefined") throw new Error("PDF text engine didn't load — check your connection and refresh.");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      out += tc.items.map((it) => it.str).join(" ") + "\n";
    }
    return out;
  }

  function updateHorse(i, path, value) {
    const next = horses.map((h) => ({ ...h, lastRace: { ...h.lastRace }, priorRace: { ...h.priorRace } }));
    const parts = path.split(".");
    let obj = next[i];
    for (let k = 0; k < parts.length - 1; k++) obj = obj[parts[k]];
    obj[parts[parts.length - 1]] = value;

  const results = horses
    .map((h, i) => ({ i, name: h.name || `Horse ${i + 1}`, post: h.postPosition, scratched: !!h.scratched, odds: parseOdds(h.mlOdds), ...rateHorse(h, raceInfo, speedScale) }))
    .sort((a, b) => (a.scratched === b.scratched ? b.rating - a.rating : a.scratched ? 1 : -1));
  const live = results.filter((r) => !r.scratched);
  const topRating = live.length ? live[0].rating : 0;
  /* SIM-CORE BEGIN — probability curve, Harville place/show, overlay math. */
  const TAU = 8;
  const expW = live.map((r) => Math.exp((r.rating - topRating) / TAU));
  const expSum = expW.reduce((a, b) => a + b, 0) || 1;
  const pWin = new Map(live.map((r, idx) => [r.i, expW[idx] / expSum]));
  // Harville formulas: probabilities of finishing 2nd and 3rd, giving place (top-2) and show (top-3)
  const placeMap = new Map(), showMap = new Map();
  {
    const ps = live.map((r) => pWin.get(r.i));
    const n = ps.length;
    for (let x = 0; x < n; x++) {
      let p2 = 0, p3 = 0;
      for (let y = 0; y < n; y++) {
        if (y === x) continue;
        const py = ps[y];
        p2 += py * (ps[x] / (1 - py));
        for (let z = 0; z < n; z++) {
          if (z === x || z === y) continue;
          const pz = ps[z];
          p3 += py * (pz / (1 - py)) * (ps[x] / (1 - py - pz));
        }
      }
      placeMap.set(live[x].i, Math.min(1, ps[x] + p2));
      showMap.set(live[x].i, Math.min(1, ps[x] + p2 + p3));
    }
  }
  const overlay = results.map((r) => {
    if (r.scratched) return { ...r, pModel: null, pPlace: null, pShow: null, pBoard: null, edge: null, fair: null };
    const pModel = pWin.get(r.i) ?? 0;
    const o = r.odds;
    const pBoard = o !== null ? 1 / (o + 1) : null;
    const edge = o !== null ? pModel * (o + 1) - 1 : null;
    const fair = pModel > 0 ? (1 - pModel) / pModel : null;
    return { ...r, pModel, pPlace: placeMap.get(r.i) ?? null, pShow: showMap.get(r.i) ?? null, pBoard, edge, fair };
  });
  const verdict = simVerdict(overlay);
  /* SIM-CORE END */
  const bestEdge = overlay.reduce((best, r) => (r.edge !== null && (best === null || r.edge > best.edge) ? r : best), null);
  let liveRank = 0;
  const withRank = overlay.map((r) => ({ ...r, ratingRank: r.scratched ? null : ++liveRank }));

    setError(""); setBusy(true); setLcdMsg("READING THE BOARD...");
    try {
      const blocks = await filesToBlocks(files);
      const names = overlay.map((o) => o.name).join("; ");
      const prompt = `This is a screenshot of a horse-race betting app board. The horses in this race are: ${names}. Extract each horse's CURRENT win odds as shown (board fractions like 9/2, 3/1 -> write "9/2", "3"). If a horse is marked scratched (SCR/strikethrough), give odds "SCR". Respond with ONLY a JSON array, no prose: [{"name":"<horse name>","odds":"<odds or SCR>"}]`;
      if (!apiKey) throw new Error("Add your Anthropic API key (⚙ Set on the home screen) to read board snapshots.");
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          temperature: 0,
          messages: [{ role: "user", content: [...blocks, { type: "text", text: prompt }] }],
        }),
      });
      if (!resp.ok) throw new Error("API HTTP " + resp.status + ": " + (await resp.text()).slice(0, 140));
      const data = await resp.json();
      const text = (data.content || []).map((c) => c.text || "").join("").replace(/```json|```/g, "").trim();
      const arr = JSON.parse(text.slice(text.indexOf("[")));
      const norm = (x) => String(x || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      let updated = 0, scratches = 0;
      const next = horses.map((h) => ({ ...h }));
      for (const item of arr) {
        const target = norm(item.name);
        let idx = overlay.findIndex((o) => norm(o.name) === target);
        if (idx < 0) idx = overlay.findIndex((o) => norm(o.name).startsWith(target) || target.startsWith(norm(o.name)));
        if (idx < 0) continue;
        const hi = overlay[idx].i;
        if (String(item.odds).toUpperCase() === "SCR") {
          if (!next[hi].scratched) { next[hi].scratched = true; scratches++; }
        } else if (item.odds) {
          next[hi].mlOdds = String(item.odds);
          updated++;
        }
      }
      persistHorses(next);
      scheduleAsk(800);
      setLogMsg(`Board read: ${updated} odds updated${scratches ? `, ${scratches} scratch${scratches > 1 ? "es" : ""} applied` : ""}.`);
      setLcdMsg("BOARD UPDATED");
    } catch (e) {
      setError("Couldn't read the board snapshot. " + (e.message || e));
      setLcdMsg("READY");
    } finally {
      setBusy(false);
      if (oddsSnapRef.current) oddsSnapRef.current.value = "";
    }
  }

  function pickFinish(r) {
    setFinishPicks((prev) => {
      if (prev.includes(r.i)) return prev.filter((x) => x !== r.i);
      if (prev.length >= 3) return prev;
      return [...prev, r.i];
    });
  }

  async function saveResults() {
    if (finishPicks.length < 3) return;
    const [p1, p2, p3] = finishPicks;
    const payNum = (v) => { const n = parseFloat(v); return Number.isFinite(n) && n > 0 ? n : null; };
    try {
      const rows = overlay.filter((o) => !o.scratched).map((o) => ({
        track: cardMeta.track || null,
        race_date: cardMeta.date || null,
        race_no: num(raceInfo.raceNumber),
        distance_f: num(raceInfo.distanceFurlongs),
        // a race taken off the turf is logged on the surface it was run on, and marked,
        // so the fall refit can exclude or study cards that mis-specified it
        surface: offTurf ? "dirt (off turf)" : (raceInfo.surface || null),
        purse: num(raceInfo.purse),
        horse: o.name,
        post: num(o.post),
        rating: o.rating,
        model_pct: Math.round(o.pModel * 1000) / 10,
        odds: o.odds,
        is_winner: o.i === p1,
        finish_pos: o.i === p1 ? 1 : o.i === p2 ? 2 : o.i === p3 ? 3 : null,
        pay_win: o.i === p1 ? payNum(resultPays.w1) : null,
        pay_place: o.i === p1 ? payNum(resultPays.p1) : o.i === p2 ? payNum(resultPays.p2) : null,
        pay_show: o.i === p1 ? payNum(resultPays.s1) : o.i === p2 ? payNum(resultPays.s2) : o.i === p3 ? payNum(resultPays.s3) : null,
      }));
      const resp = await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_race_log", {
        method: "POST",
        headers: { apikey: supaKey, Authorization: "Bearer " + supaKey, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(rows),
      });
      if (!resp.ok) throw new Error("Supabase said HTTP " + resp.status + ": " + (await resp.text()).slice(0, 140));
      // settle this race's tickets
      const rn = num(raceInfo.raceNumber);
      const bets = raceBets[rn] || [];
      const nameAt = (i) => (overlay.find((o) => o.i === i) || {}).name;
      const top = [nameAt(p1), nameAt(p2), nameAt(p3)];
      let settledNote = "";
      const settledLocal = [];
      for (const b of bets) {
        if (!b.id) { settledLocal.push(b); continue; }
        const pos = top.indexOf(b.horse);
        // scratched after the ticket was punched: refund the stake rather than book a loss
        const scr = overlay.some((o) => o.name === b.horse && o.scratched);
        const won = scr ? false : (b.bet_type === "WIN" ? pos === 0 : b.bet_type === "PLACE" ? pos >= 0 && pos <= 1 : pos >= 0);
        let payout = scr ? b.amount : (won ? null : 0);
        if (won) {
          const official = b.bet_type === "WIN" ? payNum(resultPays.w1)
            : b.bet_type === "PLACE" ? (pos === 0 ? payNum(resultPays.p1) : payNum(resultPays.p2))
            : (pos === 0 ? payNum(resultPays.s1) : pos === 1 ? payNum(resultPays.s2) : payNum(resultPays.s3));
          if (official !== null) payout = Math.round((b.amount / 2) * official * 100) / 100;
          else if (b.bet_type === "WIN") {
            const od = parseOdds(b.odds_at_bet);
            if (od !== null) payout = Math.round(b.amount * (od + 1) * 100) / 100;
          }
        }
        try {
          await fetch(supaUrl.replace(/\/+$/, "") + "/rest/v1/hra_bets?id=eq." + b.id, {
            method: "PATCH",
            headers: { ...supaHeaders(), Prefer: "return=minimal" },
            body: JSON.stringify({ settled: true, won, payout }),
          });
        } catch (settleErr) { console.error(settleErr); }
        settledLocal.push({ ...b, settled: true, won, payout });
      }
      setRaceBets((prev) => ({ ...prev, [rn]: settledLocal }));
      setLoggedRaces((prev) => ({ ...prev, [rn]: { finish: finishPicks.map((i) => (overlay.find((o) => o.i === i) || {}).name).filter(Boolean) } }));
      if (bets.length) settledNote = ` — ${bets.length} ticket${bets.length > 1 ? "s" : ""} settled`;
      setWinnerMode(false); setFinishPicks([]); setResultPays({ w1: "", p1: "", s1: "", p2: "", s2: "", s3: "" });
      setLogMsg(`Race ${raceInfo.raceNumber} official: ${nameAt(p1)} · ${nameAt(p2)} · ${nameAt(p3)}${settledNote}.`);
      const merged = { ...raceData, [activeRace]: { raceInfo, horses } };
      setRaceData(merged);
      saveCard(cardMeta, cardTitle, raceIndex, merged);
    } catch (e) {
      setLogMsg("");
      setError("Couldn't log the result. " + (e.message || e));
    }
  }

  async function logWinner(winner) {
    try {

      setWinnerMode(false);

      const merged = { ...raceData, [activeRace]: { raceInfo, horses } };
      setRaceData(merged);
      saveCard(cardMeta, cardTitle, raceIndex, merged);
    } catch (e) {
      setLogMsg("");
      setError("Couldn't log the result. " + (e.message || e));

  const isRefund = (b) => !!b && !!b.settled && !b.won && b.payout !== null && b.payout !== undefined && Number(b.payout) === Number(b.amount) && Number(b.amount) > 0;
  const raceDone = !!loggedRaces[num(raceInfo.raceNumber)] || (raceBets[num(raceInfo.raceNumber)] || []).some((b) => b.settled);

    const settled = (raceBets[rn] || []).filter((b) => b.settled);
    if (settled.length) {
      const back = settled.reduce((s, b) => s + (num(b.payout) || 0), 0);
      const staked = settled.reduce((s, b) => s + (num(b.amount) || 0), 0);
      if (settled.every(isRefund)) return "TICKET REFUNDED $" + staked.toFixed(2);
      if (settled.some((b) => b.won)) return "TICKET WON $" + back.toFixed(2);
      return "TICKET LOST \u2212$" + (staked - back).toFixed(2);
    }
    return win ? "OFFICIAL: " + win : "RACE OFFICIAL";
  })();

  const betsCardKey = (cardMeta.track || "") + "|" + (cardMeta.date || "");
